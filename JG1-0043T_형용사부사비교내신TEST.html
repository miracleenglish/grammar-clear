<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JG1-0043T 형용사·부사·비교 내신TEST</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#EAF6F1;--green:#1E5A46;--green-dark:#16432F;--mint:#4CAF93;--mint-light:#E7F7F0;--coral:#E8604C;--coral-light:#FDEAE6;--badge-basic:#4A90D9;--badge-b:#5BAD6F;--badge-c:#9B6DD1;--card-bg:#fff;--text:#1a1a1a;--gray:#888;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:'Noto Sans KR','Nunito',sans-serif;color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:16px;padding-bottom:40px;}
  .app{width:100%;max-width:480px;}
  .header{text-align:center;margin-bottom:18px;padding-top:8px;}
  .header-badges{display:flex;justify-content:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .badge-track{font-size:11.5px;font-weight:800;background:var(--badge-basic);color:#fff;padding:3px 10px;border-radius:999px;}
  .badge-type-a{font-size:11.5px;font-weight:800;background:var(--badge-basic);color:#fff;padding:3px 10px;border-radius:999px;}
  .badge-type-b{font-size:11.5px;font-weight:800;background:var(--badge-b);color:#fff;padding:3px 10px;border-radius:999px;}
  .badge-type-c{font-size:11.5px;font-weight:800;background:var(--badge-c);color:#fff;padding:3px 10px;border-radius:999px;}
  h1{font-size:19px;font-weight:800;color:var(--green);line-height:1.3;}
  .progress-wrap{height:12px;border-radius:999px;background:#d4ece3;box-shadow:inset 0 0 0 2px #b8dece;margin:14px 0 18px;overflow:hidden;}
  .progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--green));transition:width 0.4s ease;}
  .card{background:var(--card-bg);border-radius:20px;padding:22px 18px;box-shadow:0 4px 16px rgba(0,0,0,0.10);}
  .qnum{font-size:13px;color:#999;margin-bottom:6px;}
  .card-instruction{font-size:16.5px;color:#555;margin-bottom:12px;line-height:1.5;}
  .sentence-box{font-size:23px;font-family:'Nunito',sans-serif;font-weight:700;line-height:1.65;background:var(--bg);border-radius:12px;padding:14px 16px;margin-bottom:10px;color:var(--green-dark);}
  .sentence-box .blank{display:inline-block;border-bottom:3px solid var(--green);min-width:100px;text-align:center;color:var(--green);font-weight:800;}
  .sentence-box .hl{text-decoration:underline;text-decoration-thickness:2.5px;text-underline-offset:5px;text-decoration-color:var(--green-dark);}
  .hint{font-size:16px;color:#666;line-height:1.5;margin-bottom:16px;}
  .opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .opts-col{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .opt-btn{font-size:18px;font-weight:700;font-family:'Nunito','Noto Sans KR',sans-serif;padding:14px 8px;border-radius:14px;border:2.5px solid #b8dece;background:#fff;color:var(--text);cursor:pointer;transition:all 0.15s;text-align:center;line-height:1.3;}
  .opts-col .opt-btn{font-size:17px;padding:13px 14px;text-align:left;}
  .opt-btn:hover:not(:disabled){background:var(--bg);border-color:var(--mint);}
  .opt-btn.correct{background:var(--mint-light);border-color:var(--mint);color:#2E8064;}
  .opt-btn.wrong{background:var(--coral-light);border-color:var(--coral);color:#B84534;}
  .opt-btn:disabled{cursor:default;}
  .feedback{display:none;border-radius:14px;padding:14px;margin-bottom:14px;font-size:15.5px;line-height:1.6;}
  .feedback.correct{background:var(--mint-light);color:#2E8064;}
  .feedback.wrong{background:var(--coral-light);color:#B84534;}
  .fb-title{font-size:15px;font-weight:800;margin-bottom:4px;}
  .fb-sentence{font-size:17px;font-family:'Nunito',sans-serif;font-weight:700;margin-bottom:6px;}
  .fb-sentence .err{text-decoration:line-through;color:var(--coral);margin-right:4px;}
  .fb-sentence .fix{color:#2E8064;font-weight:800;}
  .next-btn{width:100%;padding:14px;border-radius:14px;font-size:16px;font-weight:800;font-family:'Noto Sans KR',sans-serif;background:var(--green);color:#fff;border:none;cursor:pointer;display:none;transition:background 0.2s;}
  .next-btn:hover{background:var(--green-dark);}
  .result-screen{display:none;background:var(--card-bg);border-radius:20px;padding:36px 18px;box-shadow:0 4px 16px rgba(0,0,0,0.10);text-align:center;}
  .result-stars{font-size:44px;margin-bottom:12px;}
  .result-score{font-size:18px;font-weight:800;color:var(--green);margin-bottom:6px;}
  .result-sub{font-size:13.5px;color:var(--gray);margin-bottom:24px;}
  .result-btns{display:flex;flex-direction:column;gap:10px;}
  .result-btn{padding:14px;border-radius:14px;font-size:15.5px;font-weight:800;font-family:'Noto Sans KR',sans-serif;border:none;cursor:pointer;transition:all 0.2s;}
  .btn-retry{background:var(--green);color:#fff;}
  .btn-retry:hover{background:var(--green-dark);}
  .btn-wrong{background:var(--coral-light);color:var(--coral);border:2px solid var(--coral);}
  .btn-wrong:hover{background:#f9d4ce;}
  .badge-type-test{font-size:11.5px;font-weight:800;background:#E8604C;color:#fff;padding:3px 10px;border-radius:999px;}
  .sentence-box{font-size:21px;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-badges"><span class="badge-track">기본</span><span class="badge-type-test">TEST</span></div>
    <h1>JG1-0043T · 내신 TEST</h1>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="card" id="quizCard">
    <div class="qnum" id="qnum">1 / 20</div>
    <div class="card-instruction" id="cardInstruction"></div>
    <div class="sentence-box" id="sentenceBox"></div>
    <div class="hint" id="hint"></div>
    <div class="opts-col" id="optsGrid"></div>
    <div class="feedback" id="feedback"><div class="fb-title" id="fbTitle"></div><div id="fbBody"></div></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()"></button>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="result-stars" id="resultStars"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-btns">
      <button class="result-btn btn-retry" onclick="retryAll()">🔄 전체 다시 풀기</button>
      <button class="result-btn btn-wrong" id="retryWrongBtn" onclick="retryWrong()">❌ 오답만 다시 풀기</button>
    </div>
  </div>
</div>
<script>
const ALL_QUESTIONS = [
  {instruction:"밑줄 친 부분 중 어법상 틀린 것을 고르세요.",sentence:"A: You don't ① look good. Are you okay?\nB: I can't ② sleep well these days. I ③ am tired always.\nA: Oh, that's ④ too bad. Why don't you take ⑤ a warm bath?",hint:"",answer:"③ am tired always",options:["① look good","② sleep well","③ am tired always","④ too bad"],feedback:"빈도부사는 be동사 뒤에 씁니다. am tired always → <b>am always tired</b>"},
  {instruction:"다음 중 어법상 틀린 것을 고르세요.",sentence:"",hint:"",answer:"④ Prices are very highly in Tokyo.",options:["① My mother drives a car well.","② Jack never breaks his promises.","③ This is the best car in our shop.","④ Prices are very highly in Tokyo."],feedback:"be동사 뒤 보어는 형용사를 씁니다. highly(부사) → <b>high</b>(형용사)"},
  {instruction:"다음 우리말을 영어로 바르게 옮긴 것을 고르세요.",sentence:"봄은 여름만큼 덥지는 않다.",hint:"원급 비교의 부정",answer:"④ Spring is not as hot as summer.",options:["① Summer is as hot as spring.","② Spring is not hot as summer.","③ Summer is not so hot as spring.","④ Spring is not as hot as summer."],feedback:"원급 비교 부정: not <b>as</b>+원급+<b>as</b>"},
  {instruction:"다음 빈칸에 들어갈 수 없는 것을 고르세요.",sentence:"Jennifer makes _____ more money than Sam.",hint:"비교급 강조 표현을 고르세요.",answer:"very",options:["much","even","very","a lot"],feedback:"비교급(more) 강조는 much/even/a lot/far를 씁니다. <b>very</b>는 비교급 강조 불가"},
  {instruction:"빈칸에 알맞은 말을 고르세요.",sentence:"Miu is <span class='blank'>  ?  </span> than Leo. (small)",hint:"Miu는 Leo보다 더 작다.",answer:"smaller",options:["smaller","more small","smallest","the smallest"],feedback:"short 형용사 비교급: small → <b>smaller</b>"},
  {instruction:"빈칸에 알맞은 말을 고르세요.",sentence:"이 재킷은 저 코트만큼 따뜻하지는 않다.\n→ This jacket is <span class='blank'>  ?  </span> that coat.",hint:"원급 비교 부정",answer:"not as warm as",options:["not as warm as","not warmer than","less warm than","as not warm as"],feedback:"원급 비교 부정: <b>not as+원급+as</b>"},
  {instruction:"빈칸에 알맞은 말을 고르세요.",sentence:"스노보드 타기는 스키 타기보다 훨씬 더 재미있다.\n→ Snowboarding is <span class='blank'>  ?  </span> skiing.",hint:"비교급 강조",answer:"much more interesting than",options:["much more interesting than","very more interesting than","more interesting much than","much interesting more than"],feedback:"비교급 강조(much)+비교급: <b>much more interesting than</b>"},
  {instruction:"다음 중 어법상 올바른 것을 바르게 짝지은 것을 고르세요.",sentence:"ⓐ I put a lot of fruit in my salad.\nⓑ My arm is as long as Veronica's.\nⓒ The thief took expensive everything.\nⓓ Mark studies much harder than Ava.\nⓔ Ian came to class lately this morning.",hint:"",answer:"ⓐ, ⓑ, ⓓ",options:["ⓐ, ⓑ","ⓑ, ⓒ","ⓐ, ⓑ, ⓓ","ⓑ, ⓓ, ⓔ"],feedback:"ⓒ expensive everything → everything expensive(-thing은 형용사가 뒤), ⓔ lately → late(늦게). <b>ⓐ, ⓑ, ⓓ</b>가 올바릅니다."},
  {instruction:"빈칸에 알맞은 말을 고르세요.",sentence:"나는 가끔 나의 옛 친구들이 그립다.\n→ I <span class='blank'>  ?  </span> my old friends.",hint:"빈도부사 + 동사 어순",answer:"sometimes miss",options:["sometimes miss","miss sometimes","always miss","never miss"],feedback:"빈도부사는 일반동사 앞에: <b>sometimes miss</b>"},
  {instruction:"빈칸에 알맞은 말을 고르세요.",sentence:"야구는 한국에서 가장 인기 있는 스포츠 중 하나이다.\n→ Baseball is one of <span class='blank'>  ?  </span> in Korea.",hint:"one of the+최상급+복수명사",answer:"the most popular sports",options:["the most popular sports","the most popular sport","most popular sports","the popular sports"],feedback:"one of the+최상급+<b>복수명사</b>: <b>the most popular sports</b>"},
  {instruction:"보기에서 알맞은 말을 골라 빈칸을 채우세요.",sentence:"[ a few   much   little ]\n① We met _____ tourists in Myeongdong.\n② The puppy ate _____ food.\n③ The travel center doesn't have _____ information.",hint:"가산/불가산 수량 표현",answer:"a few / much / little",options:["a few / much / little","a little / much / few","a few / many / little","a few / much / few"],feedback:"tourists(가산 복수) → <b>a few</b>, food(불가산, 많이) → <b>much</b>, information(불가산, 조금) → <b>little</b>"},
  {instruction:"빈칸에 알맞은 말을 고르세요.",sentence:"She <span class='blank'>  ?  </span> hard for the contest.",hint:"그녀는 대회를 위해 열심히 연습했다.",answer:"practiced",options:["practiced","practice","practised hard","practices"],feedback:"과거시제 + 동사(practice) → <b>practiced</b>. hard는 이미 부사"},
  {instruction:"다음 빈칸에 들어갈 말이 바르게 짝지어진 것을 고르세요.",sentence:"ⓐ This jacket is not as _____ as that one.\nⓑ He is one of the _____ students in the class.",hint:"원급 비교 + one of the 최상급",answer:"expensive / smartest",options:["expensive / smartest","expensively / smartest","expensive / smarter","expensively / smarter"],feedback:"as+형용사 원급+as: <b>expensive</b>, one of the+최상급: <b>smartest</b>"},
  {instruction:"다음 중 어법상 틀린 것을 고르세요.",sentence:"",hint:"",answer:"② She runs very quick.",options:["① He is a very careful driver.","② She runs very quick.","③ He speaks English more fluently than me.","④ This is the most difficult problem."],feedback:"동사(runs)를 꾸미려면 부사가 필요합니다. quick(형용사) → <b>quickly</b>"},
  {instruction:"다음 문장을 영어로 바르게 옮긴 것을 고르세요.",sentence:"책 몇 권을 살 약간의 돈을 받을 수 있을까요?",hint:"Can I have+a little money ...?",answer:"Can I have a little money to buy some books?",options:["Can I have a little money to buy some books?","Can I have a few money to buy some books?","Can I have little money to buy some books?","Can I have some money to buy a few books?"],feedback:"money(불가산) + 약간 → <b>a little</b> money"},
  {instruction:"다음 중 어법상 틀린 것을 모두 고른 것을 고르세요.",sentence:"ⓐ She is more taller than me.\nⓑ He is the most tallest boy.\nⓒ I seldom watch TV these days.\nⓓ She sings more well than before.",hint:"",answer:"ⓐ, ⓑ, ⓓ",options:["ⓐ, ⓑ","ⓐ, ⓓ","ⓑ, ⓒ","ⓐ, ⓑ, ⓓ"],feedback:"ⓐ more taller → <b>taller</b>, ⓑ most tallest → <b>tallest</b>, ⓓ more well → <b>better</b>. ⓒ는 올바릅니다."},
  {instruction:"빈칸에 알맞은 말을 고르세요.",sentence:"Science is not as popular as Korean.\n위 문장과 같은 의미인 것을 고르세요.",hint:"원급 비교 부정 → 의미 같은 표현",answer:"Korean is more popular than science.",options:["Korean is more popular than science.","Science is more popular than Korean.","Korean is as popular as science.","Science is the most popular subject."],feedback:"not as A as B = B is more A than A → <b>Korean is more popular than science.</b>"},
  {instruction:"빈칸에 알맞은 말을 고르세요.",sentence:"He is <span class='blank'>  ?  </span> student in our school.",hint:"우리 학교에서 가장 부지런한 학생",answer:"the most diligent",options:["the most diligent","most diligent","more diligent","the diligenter"],feedback:"3음절 이상 최상급: <b>the most diligent</b>"},
  {instruction:"다음 빈칸에 알맞은 말을 고르세요.",sentence:"She is <span class='blank'>  ?  </span> tired that she can't walk.",hint:"너무 피곤해서 걸을 수가 없다.",answer:"so",options:["so","very","too","much"],feedback:"so+형용사+that: '너무 ~해서 …하다' → <b>so</b>"},
  {instruction:"밑줄 친 부분을 바르게 고친 것을 고르세요.",sentence:"She sings more well than before.",hint:"well의 비교급",answer:"more well → better",options:["more well → better","well → good","than → as","before → beforehand"],feedback:"well의 비교급은 불규칙 변화로 <b>better</b>입니다."}
];
const IS_C=false;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleNoFirstAnswer(arr,answer){let result;let tries=0;do{result=shuffle(arr);tries++;}while(result[0].toLowerCase()===answer.toLowerCase()&&tries<20);return result;}
let questions=[],current=0,score=0,wrongIndexes=[];
function startQuiz(qs){questions=qs;current=0;score=0;wrongIndexes=[];document.getElementById("quizCard").style.display="";document.getElementById("resultScreen").style.display="none";showQuestion();}
function showQuestion(){const q=questions[current],total=questions.length;document.getElementById("qnum").textContent=`${current+1} / ${total}`;document.getElementById("progressBar").style.width=`${(current/total)*100}%`;document.getElementById("cardInstruction").textContent=q.instruction;if(IS_C){document.getElementById("sentenceBox").textContent=q.sentence;}else{document.getElementById("sentenceBox").innerHTML=q.sentence;}document.getElementById("hint").textContent=q.hint?"💡 "+q.hint:"";const fb=document.getElementById("feedback");fb.style.display="none";fb.className="feedback";document.getElementById("nextBtn").style.display="none";const fbS=document.getElementById("fbSentence");if(fbS)fbS.style.display="none";const grid=document.getElementById("optsGrid");grid.innerHTML="";grid.className=IS_C?"opts-col":"opts-col";shuffleNoFirstAnswer(q.options,q.answer).forEach(opt=>{const btn=document.createElement("button");btn.className="opt-btn";btn.textContent=opt;btn.onclick=()=>selectAnswer(opt,btn);grid.appendChild(btn);});}
function selectAnswer(selected,clickedBtn){const q=questions[current];document.querySelectorAll(".opt-btn").forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add("correct");});const fb=document.getElementById("feedback");const isCorrect=selected.toLowerCase()===q.answer.toLowerCase();if(isCorrect){score++;clickedBtn.classList.add("correct");fb.className="feedback correct";document.getElementById("fbTitle").textContent="✅ 정답!";}else{clickedBtn.classList.add("wrong");fb.className="feedback wrong";document.getElementById("fbTitle").textContent="❌ 오답";wrongIndexes.push(current);}const fbS=document.getElementById("fbSentence");if(fbS&&q.fbSentence){fbS.innerHTML=q.fbSentence;fbS.style.display="block";}document.getElementById("fbBody").innerHTML=q.feedback;fb.style.display="block";const nextBtn=document.getElementById("nextBtn");nextBtn.style.display="block";nextBtn.textContent=current+1<questions.length?"다음 문제 →":"결과 보기 🏁";}
function nextQuestion(){current++;if(current<questions.length)showQuestion();else showResult();}
function showResult(){document.getElementById("quizCard").style.display="none";const rs=document.getElementById("resultScreen");rs.style.display="block";const total=questions.length,pct=score/total;document.getElementById("resultStars").textContent=pct>=0.9?"⭐⭐⭐":pct>=0.6?"⭐⭐":"⭐";document.getElementById("resultScore").textContent=`${score} / ${total} 정답`;document.getElementById("resultSub").textContent=pct>=0.9?'완벽해요! 내신 TEST 마스터! 🏆 🎉':pct>=0.6?"잘했어요! 조금만 더 연습해봐요.":"다시 한번 도전해봐요!";document.getElementById("progressBar").style.width="100%";document.getElementById("retryWrongBtn").style.display=wrongIndexes.length>0?"block":"none";}
function retryAll(){startQuiz(shuffle([...ALL_QUESTIONS]));}
function retryWrong(){if(!wrongIndexes.length)return;startQuiz(shuffle(wrongIndexes.map(i=>questions[i])));}
startQuiz(shuffle([...ALL_QUESTIONS]));
</script>
</body>
</html>
