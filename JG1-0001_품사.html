<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JG1-0001 품사</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF6F1;
    --green: #1E5A46;
    --green-dark: #16432F;
    --mint: #4CAF93;
    --mint-light: #E7F7F0;
    --coral: #E8604C;
    --coral-light: #FDEAE6;
    --badge-basics: #D4AF37;
    --badge-a: #4A90D9;
    --card-bg: #fff;
    --text: #1a1a1a;
    --gray: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: 'Noto Sans KR', 'Nunito', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
    padding-bottom: 40px;
  }
  .app { width: 100%; max-width: 480px; }

  /* 헤더 */
  .header { text-align: center; margin-bottom: 18px; padding-top: 8px; }
  .header-badges { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .badge-basics {
    font-size: 11.5px; font-weight: 800;
    background: var(--badge-basics); color: #fff;
    padding: 3px 10px; border-radius: 999px;
  }
  .badge-type {
    font-size: 11.5px; font-weight: 800;
    background: var(--badge-a); color: #fff;
    padding: 3px 10px; border-radius: 999px;
  }
  h1 {
    font-size: 19px; font-weight: 800;
    color: var(--green); line-height: 1.3;
  }

  /* 진행 바 */
  .progress-wrap {
    height: 12px; border-radius: 999px;
    background: #d4ece3;
    box-shadow: inset 0 0 0 2px #b8dece;
    margin: 14px 0 18px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--mint), var(--green));
    transition: width 0.4s ease;
  }

  /* 카드 */
  .card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 22px 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.10);
  }
  .qnum { font-size: 13px; color: #999; margin-bottom: 6px; }
  .card-instruction {
    font-size: 16.5px; color: #555;
    margin-bottom: 12px; line-height: 1.5;
  }
  .sentence-box {
    font-size: 23px; font-family: 'Nunito', sans-serif;
    font-weight: 700; line-height: 1.6;
    background: var(--bg); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
    color: var(--green-dark);
  }
  .sentence-box .hl {
    text-decoration: underline;
    text-decoration-thickness: 2.5px;
    text-underline-offset: 5px;
    text-decoration-color: var(--green-dark);
  }
  .sentence-box .blank {
    display: inline-block;
    border-bottom: 2.5px solid var(--green);
    min-width: 80px; text-align: center;
    color: var(--green); font-weight: 800;
  }
  .hint {
    font-size: 16px; color: #666;
    line-height: 1.5; margin-bottom: 16px;
  }

  /* 선택지 그리드 */
  .opts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .opt-btn {
    font-size: 18px; font-weight: 700;
    font-family: 'Nunito', 'Noto Sans KR', sans-serif;
    padding: 14px 8px; border-radius: 14px;
    border: 2.5px solid #b8dece;
    background: #fff; color: var(--text);
    cursor: pointer; transition: all 0.15s;
    text-align: center; line-height: 1.3;
  }
  .opt-btn:hover:not(:disabled) { background: var(--bg); border-color: var(--mint); }
  .opt-btn.correct { background: var(--mint-light); border-color: var(--mint); color: #2E8064; }
  .opt-btn.wrong { background: var(--coral-light); border-color: var(--coral); color: #B84534; }
  .opt-btn:disabled { cursor: default; }

  /* 피드백 */
  .feedback {
    display: none;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    font-size: 15.5px; line-height: 1.6;
  }
  .feedback.correct { background: var(--mint-light); color: #2E8064; }
  .feedback.wrong { background: var(--coral-light); color: #B84534; }
  .fb-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }

  /* 다음 버튼 */
  .next-btn {
    width: 100%; padding: 14px; border-radius: 14px;
    font-size: 16px; font-weight: 800;
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--green); color: #fff;
    border: none; cursor: pointer;
    display: none; transition: background 0.2s;
  }
  .next-btn:hover { background: var(--green-dark); }

  /* 결과 화면 */
  .result-screen {
    display: none;
    background: var(--card-bg);
    border-radius: 20px;
    padding: 36px 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.10);
    text-align: center;
  }
  .result-stars { font-size: 44px; margin-bottom: 12px; }
  .result-score { font-size: 18px; font-weight: 800; color: var(--green); margin-bottom: 6px; }
  .result-sub { font-size: 13.5px; color: var(--gray); margin-bottom: 24px; }
  .result-btns { display: flex; flex-direction: column; gap: 10px; }
  .result-btn {
    padding: 14px; border-radius: 14px;
    font-size: 15.5px; font-weight: 800;
    font-family: 'Noto Sans KR', sans-serif;
    border: none; cursor: pointer; transition: all 0.2s;
  }
  .btn-retry { background: var(--green); color: #fff; }
  .btn-retry:hover { background: var(--green-dark); }
  .btn-wrong { background: var(--coral-light); color: var(--coral); border: 2px solid var(--coral); }
  .btn-wrong:hover { background: #f9d4ce; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-badges">
      <span class="badge-basics">Grammar Basics</span>
      <span class="badge-type">A형</span>
    </div>
    <h1>JG1-0001 · 품사</h1>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>

  <div class="card" id="quizCard">
    <div class="qnum" id="qnum">1 / 16</div>
    <div class="card-instruction" id="cardInstruction"></div>
    <div class="sentence-box" id="sentenceBox"></div>
    <div class="hint" id="hint"></div>
    <div class="opts-grid" id="optsGrid"></div>
    <div class="feedback" id="feedback">
      <div class="fb-title" id="fbTitle"></div>
      <div id="fbBody"></div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()"></button>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="result-stars" id="resultStars"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-btns">
      <button class="result-btn btn-retry" onclick="retryAll()">🔄 전체 다시 풀기</button>
      <button class="result-btn btn-wrong" id="retryWrongBtn" onclick="retryWrong()">❌ 오답만 다시 풀기</button>
    </div>
  </div>
</div>

  },
  // ⑤ 부사
  {

// ── 유틸 ─────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffleNoFirstAnswer(arr, answer) {
  let result; let tries = 0;
  do {
    result = shuffle(arr); tries++;
  } while (result[0].toLowerCase() === answer.toLowerCase() && tries < 20);
  return result;
}

// ── 게임 상태 ─────────────────────────────────────────────────
let questions = [];
let current = 0;
let score = 0;
let wrongIndexes = [];
let isWrongRetry = false;

function startQuiz(qs) {
  questions = qs;
  current = 0; score = 0; wrongIndexes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('resultScreen').style.display = 'none';
  showQuestion();
}

function showQuestion() {
  const q = questions[current];
  const total = questions.length;
  document.getElementById('qnum').textContent = `${current + 1} / ${total}`;
  document.getElementById('progressBar').style.width = `${(current / total) * 100}%`;
  document.getElementById('cardInstruction').textContent = q.instruction;
  document.getElementById('sentenceBox').innerHTML = q.sentence;
  document.getElementById('hint').textContent = '💡 ' + q.hint;

  // 피드백·버튼 초기화
  const fb = document.getElementById('feedback');
  fb.style.display = 'none'; fb.className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';

  // 선택지
  const grid = document.getElementById('optsGrid');
  grid.innerHTML = '';
  const shuffled = shuffleNoFirstAnswer(q.options, q.answer);
  shuffled.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(opt, btn);
    grid.appendChild(btn);
  });
}

function selectAnswer(selected, clickedBtn) {
  const q = questions[current];
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
  });

  const fb = document.getElementById('feedback');
  const isCorrect = selected.toLowerCase() === q.answer.toLowerCase();
  if (isCorrect) {
    score++;
    clickedBtn.classList.add('correct');
    fb.className = 'feedback correct';
    document.getElementById('fbTitle').textContent = '✅ 정답!';
  } else {
    clickedBtn.classList.add('wrong');
    fb.className = 'feedback wrong';
    document.getElementById('fbTitle').textContent = '❌ 오답';
    wrongIndexes.push(current);
  }
  document.getElementById('fbBody').innerHTML = q.feedback;
  fb.style.display = 'block';

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = current + 1 < questions.length ? '다음 문제 →' : '결과 보기 🏁';
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quizCard').style.display = 'none';
  const rs = document.getElementById('resultScreen');
  rs.style.display = 'block';
  const total = questions.length;
  const pct = score / total;
  let stars = '⭐';
  if (pct >= 0.9) stars = '⭐⭐⭐';
  else if (pct >= 0.6) stars = '⭐⭐';
  document.getElementById('resultStars').textContent = stars;
  document.getElementById('resultScore').textContent = `${score} / ${total} 정답`;
  document.getElementById('resultSub').textContent =
    pct >= 0.9 ? '완벽해요! 품사 마스터! 🎉' :
    pct >= 0.6 ? '잘했어요! 조금만 더 연습해봐요.' : '다시 한번 도전해봐요!';
  document.getElementById('progressBar').style.width = '100%';

  const wrongBtn = document.getElementById('retryWrongBtn');
  wrongBtn.style.display = wrongIndexes.length > 0 ? 'block' : 'none';
}

function retryAll() {
  isWrongRetry = false;
  startQuiz(shuffle([...ALL_QUESTIONS]));
}

function retryWrong() {
  if (wrongIndexes.length === 0) return;
  isWrongRetry = true;
  const wrongQs = wrongIndexes.map(i => questions[i]);
  startQuiz(shuffle(wrongQs));
}

// 시작
startQuiz(shuffle([...ALL_QUESTIONS]));
</script>
</body>
</html>
