<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JG2-0043 관계대명사의 생략·관계부사</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF6F1; --green: #1E5A46; --green-dark: #16432F;
    --mint: #4CAF93; --mint-light: #E7F7F0;
    --coral: #E8604C; --coral-light: #FDEAE6;
    --badge-basic: #4A90D9;
    --card-bg: #fff; --text: #1a1a1a; --gray: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'Noto Sans KR', 'Nunito', sans-serif; color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 16px; padding-bottom: 40px; }
  .app { width: 100%; max-width: 480px; }
  .header { text-align: center; margin-bottom: 18px; padding-top: 8px; }
  .header-badges { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .badge-track { font-size: 11.5px; font-weight: 800; background: var(--badge-basic); color: #fff; padding: 3px 10px; border-radius: 999px; }
  .badge-type { font-size: 11.5px; font-weight: 800; background: var(--badge-basic); color: #fff; padding: 3px 10px; border-radius: 999px; }
  h1 { font-size: 19px; font-weight: 800; color: var(--green); line-height: 1.3; }
  .progress-wrap { height: 12px; border-radius: 999px; background: #d4ece3; box-shadow: inset 0 0 0 2px #b8dece; margin: 14px 0 18px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--mint), var(--green)); transition: width 0.4s ease; }
  .card { background: var(--card-bg); border-radius: 20px; padding: 22px 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.10); }
  .qnum { font-size: 13px; color: #999; margin-bottom: 6px; }
  .card-instruction { font-size: 16.5px; color: #555; margin-bottom: 12px; line-height: 1.5; }
  .sentence-box { font-size: 18px; font-family: 'Nunito', sans-serif; font-weight: 700; line-height: 1.6; background: var(--bg); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; color: var(--green-dark); }
  .sentence-box .blank { display: inline-block; border-bottom: 3px solid var(--green); min-width: 72px; text-align: center; color: var(--green); font-weight: 800; }
  .sentence-box .hl { text-decoration: underline; text-decoration-thickness: 2.5px; text-underline-offset: 5px; text-decoration-color: var(--green-dark); }
  .hint { font-size: 16px; color: #666; line-height: 1.5; margin-bottom: 16px; }
  .opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .opt-btn { font-size: 17px; font-weight: 700; font-family: 'Nunito', 'Noto Sans KR', sans-serif; padding: 14px 8px; border-radius: 14px; border: 2.5px solid #b8dece; background: #fff; color: var(--text); cursor: pointer; transition: all 0.15s; text-align: center; line-height: 1.3; }
  .opt-btn:hover:not(:disabled) { background: var(--bg); border-color: var(--mint); }
  .opt-btn.correct { background: var(--mint-light); border-color: var(--mint); color: #2E8064; }
  .opt-btn.wrong { background: var(--coral-light); border-color: var(--coral); color: #B84534; }
  .opt-btn:disabled { cursor: default; }
  .feedback { display: none; border-radius: 14px; padding: 14px; margin-bottom: 14px; font-size: 15.5px; line-height: 1.6; }
  .feedback.correct { background: var(--mint-light); color: #2E8064; }
  .feedback.wrong { background: var(--coral-light); color: #B84534; }
  .fb-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .next-btn { width: 100%; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 800; font-family: 'Noto Sans KR', sans-serif; background: var(--green); color: #fff; border: none; cursor: pointer; display: none; transition: background 0.2s; }
  .next-btn:hover { background: var(--green-dark); }
  .result-screen { display: none; background: var(--card-bg); border-radius: 20px; padding: 36px 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.10); text-align: center; }
  .result-stars { font-size: 44px; margin-bottom: 12px; }
  .result-score { font-size: 18px; font-weight: 800; color: var(--green); margin-bottom: 6px; }
  .result-sub { font-size: 13.5px; color: var(--gray); margin-bottom: 24px; }
  .result-btns { display: flex; flex-direction: column; gap: 10px; }
  .result-btn { padding: 14px; border-radius: 14px; font-size: 15.5px; font-weight: 800; font-family: 'Noto Sans KR', sans-serif; border: none; cursor: pointer; transition: all 0.2s; }
  .btn-retry { background: var(--green); color: #fff; }
  .btn-retry:hover { background: var(--green-dark); }
  .btn-wrong { background: var(--coral-light); color: var(--coral); border: 2px solid var(--coral); }
  .btn-wrong:hover { background: #f9d4ce; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-badges">
      <span class="badge-track">기본</span>
      <span class="badge-type">A형</span>
    </div>
    <h1>JG2-0043 · 관계대명사의 생략·관계부사</h1>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="card" id="quizCard">
    <div class="qnum" id="qnum">1 / 12</div>
    <div class="card-instruction" id="cardInstruction"></div>
    <div class="sentence-box" id="sentenceBox"></div>
    <div class="hint" id="hint"></div>
    <div class="opts-grid" id="optsGrid"></div>
    <div class="feedback" id="feedback">
      <div class="fb-title" id="fbTitle"></div>
      <div id="fbBody"></div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()"></button>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="result-stars" id="resultStars"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-btns">
      <button class="result-btn btn-retry" onclick="retryAll()">🔄 전체 다시 풀기</button>
      <button class="result-btn btn-wrong" id="retryWrongBtn" onclick="retryWrong()">❌ 오답만 다시 풀기</button>
    </div>
  </div>
</div>
<script>
const ALL_QUESTIONS = [
  {
    instruction: "다음 문장에서 생략할 수 있는 것을 고르세요.",
    sentence: "This is the sweater which my grandmother made.",
    hint: "이것은 할머니가 만들어 주신 스웨터이다.",
    answer: "which",
    options: ["which", "This is", "my grandmother", "made"],
    feedback: "동사(made)의 목적어로 쓰인 목적격 관계대명사 <b>which</b>는 생략할 수 있습니다."
  },
  {
    instruction: "다음 문장에서 생략할 수 있는 것을 고르세요.",
    sentence: "This is the apartment which he lives in.",
    hint: "이것은 그가 사는 아파트이다.",
    answer: "which",
    options: ["which", "This is", "he lives", "in"],
    feedback: "전치사(in)의 목적어로 쓰인 목적격 관계대명사 <b>which</b>는 생략할 수 있습니다."
  },
  {
    instruction: "빈칸에 들어갈 수 없는 것을 고르세요.",
    sentence: "This is the apartment <span class='blank'>  ?  </span> he lives.",
    hint: "이것은 그가 사는 아파트이다. (전치사+관계대명사)",
    answer: "that",
    options: ["that", "which", "in which", "where"],
    feedback: "「전치사+관계대명사」일 때는 that을 쓸 수 없습니다. 정답은(들어갈 수 없는 것) <b>that</b>입니다."
  },
  {
    instruction: "다음 문장에서 생략할 수 있는 것을 고르세요.",
    sentence: "The girl who is leaning against the wall is my sister.",
    hint: "벽에 기대어 있는 소녀는 내 여동생이다.",
    answer: "who is",
    options: ["who is", "The girl", "leaning against", "is my sister"],
    feedback: "「주격 관계대명사+be동사」는 함께 생략할 수 있습니다. 정답은 <b>who is</b>입니다."
  },
  {
    instruction: "빈칸에 알맞은 것을 고르세요.",
    sentence: "I remember the day <span class='blank'>  ?  </span> I first met Jake.",
    hint: "나는 처음 Jake를 만났던 날을 기억한다.",
    answer: "when",
    options: ["when", "where", "why", "how"],
    feedback: "시간을 나타내는 명사(the day)가 선행사이므로 관계부사 <b>when</b>을 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 것을 고르세요.",
    sentence: "Is this the town <span class='blank'>  ?  </span> you grew up?",
    hint: "여기가 네가 자란 마을이니?",
    answer: "where",
    options: ["where", "when", "why", "how"],
    feedback: "장소를 나타내는 명사(the town)가 선행사이므로 관계부사 <b>where</b>를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 것을 고르세요.",
    sentence: "I don't know the reason <span class='blank'>  ?  </span> she shouted at me.",
    hint: "나는 그녀가 나에게 왜 소리쳤는지 모른다.",
    answer: "why",
    options: ["why", "when", "where", "how"],
    feedback: "이유를 나타내는 명사(the reason)가 선행사이므로 관계부사 <b>why</b>를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 것을 고르세요.",
    sentence: "This is <span class='blank'>  ?  </span> my friend trains his dog.",
    hint: "이것이 내 친구가 개를 훈련시키는 방법이다.",
    answer: "how",
    options: ["how", "the way how", "when", "where"],
    feedback: "선행사 the way와 관계부사 how는 함께 쓰지 않고 둘 중 하나만 씁니다. 정답은 <b>how</b>입니다."
  },
  {
    instruction: "빈칸에 알맞은 것을 고르세요.",
    sentence: "Do you know the reason <span class='blank'>  ?  </span> Jessie is angry?",
    hint: "너는 Jessie가 화난 이유를 아니?",
    answer: "why",
    options: ["why", "when", "where", "how"],
    feedback: "이유를 나타내는 명사(the reason)가 선행사이므로 관계부사 <b>why</b>를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 것을 고르세요.",
    sentence: "June 5 is the day <span class='blank'>  ?  </span> Sue arrived in New York.",
    hint: "6월 5일은 Sue가 뉴욕에 도착한 날이다.",
    answer: "when",
    options: ["when", "where", "why", "how"],
    feedback: "시간을 나타내는 명사(the day)가 선행사이므로 관계부사 <b>when</b>을 씁니다."
  },
  {
    instruction: "다음 문장을 관계부사를 이용하여 바르게 바꾼 것을 고르세요.",
    sentence: "That's the reason. + I didn't go there with Liam for that reason.",
    hint: "그것이 내가 Liam과 함께 그곳에 가지 않은 이유이다.",
    answer: "That's the reason why I didn't go there with Liam.",
    options: ["That's the reason why I didn't go there with Liam.", "That's the reason when I didn't go there with Liam.", "That's the reason where I didn't go there with Liam.", "That's the reason how I didn't go there with Liam."],
    feedback: "이유를 나타내는 선행사(the reason)에는 관계부사 why를 씁니다. 정답은 <b>That's the reason why I didn't go there with Liam.</b>입니다."
  },
  {
    instruction: "빈칸에 알맞은 것을 고르세요.",
    sentence: "The wedding hall on the corner is the place <span class='blank'>  ?  </span> my parents got married.",
    hint: "모퉁이에 있는 그 웨딩홀은 부모님이 결혼하신 곳이다.",
    answer: "where",
    options: ["where", "when", "why", "how"],
    feedback: "장소를 나타내는 명사(the place)가 선행사이므로 관계부사 <b>where</b>를 씁니다."
  }
];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function shuffleNoFirstAnswer(arr, answer) {
  let result; let tries = 0;
  do { result = shuffle(arr); tries++; }
  while (result[0].toLowerCase() === answer.toLowerCase() && tries < 20);
  return result;
}
let questions = [], current = 0, score = 0, wrongIndexes = [], isWrongRetry = false;
function startQuiz(qs) {
  questions = qs; current = 0; score = 0; wrongIndexes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('resultScreen').style.display = 'none';
  showQuestion();
}
function showQuestion() {
  const q = questions[current], total = questions.length;
  document.getElementById('qnum').textContent = `${current + 1} / ${total}`;
  document.getElementById('progressBar').style.width = `${(current / total) * 100}%`;
  document.getElementById('cardInstruction').textContent = q.instruction;
  document.getElementById('sentenceBox').innerHTML = q.sentence;
  const hintEl = document.getElementById('hint');
  if (q.hint) { hintEl.style.display = ''; hintEl.textContent = '💡 ' + q.hint; } else { hintEl.style.display = 'none'; }
  const fb = document.getElementById('feedback');
  fb.style.display = 'none'; fb.className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';
  const grid = document.getElementById('optsGrid');
  grid.innerHTML = '';
  shuffleNoFirstAnswer(q.options, q.answer).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn'; btn.textContent = opt;
    btn.onclick = () => selectAnswer(opt, btn);
    grid.appendChild(btn);
  });
}
function selectAnswer(selected, clickedBtn) {
  const q = questions[current];
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
  });
  const fb = document.getElementById('feedback');
  const isCorrect = selected.toLowerCase() === q.answer.toLowerCase();
  if (isCorrect) { score++; clickedBtn.classList.add('correct'); fb.className = 'feedback correct'; document.getElementById('fbTitle').textContent = '✅ 정답!'; }
  else { clickedBtn.classList.add('wrong'); fb.className = 'feedback wrong'; document.getElementById('fbTitle').textContent = '❌ 오답'; wrongIndexes.push(current); }
  document.getElementById('fbBody').innerHTML = q.feedback;
  fb.style.display = 'block';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = current + 1 < questions.length ? '다음 문제 →' : '결과 보기 🏁';
}
function nextQuestion() { current++; if (current < questions.length) showQuestion(); else showResult(); }
function showResult() {
  document.getElementById('quizCard').style.display = 'none';
  const rs = document.getElementById('resultScreen'); rs.style.display = 'block';
  const total = questions.length, pct = score / total;
  document.getElementById('resultStars').textContent = pct >= 0.9 ? '⭐⭐⭐' : pct >= 0.6 ? '⭐⭐' : '⭐';
  document.getElementById('resultScore').textContent = `${score} / ${total} 정답`;
  document.getElementById('resultSub').textContent = pct >= 0.9 ? '완벽해요! 관계대명사 생략·관계부사 마스터! 🎉' : pct >= 0.6 ? '잘했어요! 조금만 더 연습해봐요.' : '다시 한번 도전해봐요!';
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('retryWrongBtn').style.display = wrongIndexes.length > 0 ? 'block' : 'none';
}
function retryAll() { isWrongRetry = false; startQuiz(shuffle([...ALL_QUESTIONS])); }
function retryWrong() { if (!wrongIndexes.length) return; isWrongRetry = true; startQuiz(shuffle(wrongIndexes.map(i => questions[i]))); }
startQuiz(shuffle([...ALL_QUESTIONS]));
</script>
</body>
</html>
