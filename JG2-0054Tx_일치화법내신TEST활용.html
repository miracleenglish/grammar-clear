<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JG2-0054Tx 일치와 화법 내신TEST</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF6F1; --green: #1E5A46; --green-dark: #16432F;
    --mint: #4CAF93; --mint-light: #E7F7F0;
    --coral: #E8604C; --coral-light: #FDEAE6;
    --badge-test: #E8604C;
    --card-bg: #fff; --text: #1a1a1a; --gray: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'Noto Sans KR', 'Nunito', sans-serif; color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 16px; padding-bottom: 40px; }
  .app { width: 100%; max-width: 480px; }
  .header { text-align: center; margin-bottom: 18px; padding-top: 8px; }
  .header-badges { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .badge-track { font-size: 11.5px; font-weight: 800; background: var(--badge-test); color: #fff; padding: 3px 10px; border-radius: 999px; }
  .badge-type { font-size: 11.5px; font-weight: 800; background: var(--badge-test); color: #fff; padding: 3px 10px; border-radius: 999px; }
  h1 { font-size: 19px; font-weight: 800; color: var(--green); line-height: 1.3; }
  .progress-wrap { height: 12px; border-radius: 999px; background: #d4ece3; box-shadow: inset 0 0 0 2px #b8dece; margin: 14px 0 18px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--mint), var(--green)); transition: width 0.4s ease; }
  .card { background: var(--card-bg); border-radius: 20px; padding: 22px 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.10); }
  .qnum { font-size: 13px; color: #999; margin-bottom: 6px; }
  .card-instruction { font-size: 16.5px; color: #555; margin-bottom: 12px; line-height: 1.5; }
  .sentence-box { font-size: 17.5px; font-family: 'Nunito', sans-serif; font-weight: 700; line-height: 1.65; background: var(--bg); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; color: var(--green-dark); }
  .sentence-box .blank { display: inline-block; border-bottom: 3px solid var(--green); min-width: 72px; text-align: center; color: var(--green); font-weight: 800; }
  .sentence-box .hl { text-decoration: underline; text-decoration-thickness: 2.5px; text-underline-offset: 5px; text-decoration-color: var(--green-dark); }
  .hint { font-size: 16px; color: #666; line-height: 1.5; margin-bottom: 16px; display: none; }
  .opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .opt-btn { font-size: 14.5px; font-weight: 700; font-family: 'Nunito', 'Noto Sans KR', sans-serif; padding: 14px 8px; border-radius: 14px; border: 2.5px solid #b8dece; background: #fff; color: var(--text); cursor: pointer; transition: all 0.15s; text-align: center; line-height: 1.3; }
  .opt-btn:hover:not(:disabled) { background: var(--bg); border-color: var(--mint); }
  .opt-btn.correct { background: var(--mint-light); border-color: var(--mint); color: #2E8064; }
  .opt-btn.wrong { background: var(--coral-light); border-color: var(--coral); color: #B84534; }
  .opt-btn:disabled { cursor: default; }
  .feedback { display: none; border-radius: 14px; padding: 14px; margin-bottom: 14px; font-size: 15.5px; line-height: 1.6; }
  .feedback.correct { background: var(--mint-light); color: #2E8064; }
  .feedback.wrong { background: var(--coral-light); color: #B84534; }
  .fb-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .next-btn { width: 100%; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 800; font-family: 'Noto Sans KR', sans-serif; background: var(--green); color: #fff; border: none; cursor: pointer; display: none; transition: background 0.2s; }
  .next-btn:hover { background: var(--green-dark); }
  .result-screen { display: none; background: var(--card-bg); border-radius: 20px; padding: 36px 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.10); text-align: center; }
  .result-stars { font-size: 44px; margin-bottom: 12px; }
  .result-score { font-size: 18px; font-weight: 800; color: var(--green); margin-bottom: 6px; }
  .result-sub { font-size: 13.5px; color: var(--gray); margin-bottom: 24px; }
  .result-btns { display: flex; flex-direction: column; gap: 10px; }
  .result-btn { padding: 14px; border-radius: 14px; font-size: 15.5px; font-weight: 800; font-family: 'Noto Sans KR', sans-serif; border: none; cursor: pointer; transition: all 0.2s; }
  .btn-retry { background: var(--green); color: #fff; }
  .btn-retry:hover { background: var(--green-dark); }
  .btn-wrong { background: var(--coral-light); color: var(--coral); border: 2px solid var(--coral); }
  .btn-wrong:hover { background: #f9d4ce; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-badges">
      <span class="badge-track">활용</span>
      <span class="badge-type">내신TEST</span>
    </div>
    <h1>JG2-0054Tx · 일치와 화법 내신TEST</h1>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="card" id="quizCard">
    <div class="qnum" id="qnum">1 / 20</div>
    <div class="card-instruction" id="cardInstruction"></div>
    <div class="sentence-box" id="sentenceBox"></div>
    <div class="hint" id="hint"></div>
    <div class="opts-grid" id="optsGrid"></div>
    <div class="feedback" id="feedback">
      <div class="fb-title" id="fbTitle"></div>
      <div id="fbBody"></div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()"></button>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="result-stars" id="resultStars"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-btns">
      <button class="result-btn btn-retry" onclick="retryAll()">🔄 전체 다시 풀기</button>
      <button class="result-btn btn-wrong" id="retryWrongBtn" onclick="retryWrong()">❌ 오답만 다시 풀기</button>
    </div>
  </div>
</div>
<script>
const ALL_QUESTIONS = [
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"Jessica thought that her mom <span class='blank'> ? </span> cooking in the kitchen.", hint:"", answer:"was", options:["was","is","be","being"], feedback:"주절이 과거(thought)이면 종속절도 과거시제입니다. 정답은 <b>was</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"I learned that Jupiter <span class='blank'> ? </span> larger than Earth.", hint:"", answer:"is", options:["is","was","has been","had been"], feedback:"변하지 않는 과학적 사실은 항상 현재시제를 씁니다. 정답은 <b>is</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"She asked John <span class='blank'> ? </span> he liked me.", hint:"", answer:"if", options:["if","that","as","while"], feedback:"의문사가 없는 간접의문문은 if를 씁니다. 정답은 <b>if</b>입니다." },
  { instruction:"빈칸에 들어갈 말이 순서대로 알맞게 짝지어진 것을 고르세요.", sentence:"· The teacher said that whales <span class='blank'> ? </span> the biggest animals in the sea.\n· I learned that the French Revolution <span class='blank'> ? </span> in 1789.", hint:"", answer:"are - began", options:["are - began","were - began","are - begins","were - had begun"], feedback:"변하지 않는 사실은 현재시제, 역사적 사실은 과거시제입니다. 정답은 <b>are - began</b>입니다." },
  { instruction:"빈칸에 들어갈 말이 순서대로 알맞게 짝지어진 것을 고르세요.", sentence:"· My teacher asked me what I <span class='blank'> ? </span>.\n· She told me that she <span class='blank'> ? </span> the Christmas tree that morning.", hint:"", answer:"was thinking - had decorated", options:["was thinking - had decorated","think - decorates","was thinking - has decorated","am thinking - has decorated"], feedback:"간접의문문의 시제 일치와, 종속절의 때가 주절보다 앞선 과거완료입니다. 정답은 <b>was thinking - had decorated</b>입니다." },
  { instruction:"빈칸에 들어갈 말이 순서대로 알맞게 짝지어진 것을 고르세요.", sentence:"A: Do you know why Rick <span class='blank'> ? </span> in the hospital now?\nB: Yes. He told me that he <span class='blank'> ? </span> his leg.", hint:"", answer:"is - had broken", options:["is - had broken","was - broke","is - has broken","was - has broken"], feedback:"현재 상태는 현재시제, 종속절이 주절보다 앞선 일은 과거완료입니다. 정답은 <b>is - had broken</b>입니다." },
  { instruction:"다음 문장을 간접화법으로 알맞게 바꾼 것을 고르세요.", sentence:"Lily said to me, \"I will stay home.\"", hint:"", answer:"Lily told me that she would stay home.", options:["Lily told me that she would stay home.", "Lily told me that she stayed home.", "Lily told me that I would stay home.", "Lily told me that she will stay home."], feedback:"say to는 tell로, 인칭대명사와 조동사(will→would)를 전달자에 맞춥니다. 정답은 <b>Lily told me that she would stay home.</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"I don't know <span class='blank'> ? </span> the train leaves.", hint:"", answer:"when", options:["when","if","that","which"], feedback:"의문사가 있는 간접의문문은 「의문사+주어+동사」입니다. 정답은 <b>when</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"I don't know <span class='blank'> ? </span> ate my yogurt.", hint:"", answer:"who", options:["who","who did","that who","did who"], feedback:"의문사가 주어이면 「의문사+동사」 어순을 그대로 씁니다. 정답은 <b>who</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"Please tell me <span class='blank'> ? </span> you will come to the party.", hint:"", answer:"if", options:["if","that","what","when"], feedback:"의문사가 없는 간접의문문은 if를 씁니다. 정답은 <b>if</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"<span class='blank'> ? </span> do you think he will buy?", hint:"", answer:"What", options:["What","That","If","Whether"], feedback:"주절의 동사가 think일 때 의문사는 문장 맨 앞에 옵니다. 정답은 <b>What</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"He wonders <span class='blank'> ? </span> Carrie and her sister study at the library.", hint:"", answer:"if", options:["if","that","what","when"], feedback:"의문사가 없으므로 if를 씁니다. 정답은 <b>if</b>입니다." },
  { instruction:"다음 두 문장을 하나의 간접의문문으로 바르게 연결한 것을 고르세요.", sentence:"I don't know. + What is your name?", hint:"", answer:"I don't know what your name is.", options:["I don't know what your name is.","I don't know what is your name.","I don't know your name what is.","I don't know that your name is."], feedback:"간접의문문은 「의문사+주어+동사」 어순입니다. 정답은 <b>I don't know what your name is.</b>입니다." },
  { instruction:"다음 문장을 간접화법으로 알맞게 바꾼 것을 고르세요.", sentence:"David said to me, \"I am hungry.\"", hint:"", answer:"David told me that he was hungry.", options:["David told me that he was hungry.","David said me that he was hungry.","David told me that I was hungry.","David told me, \"I am hungry.\""], feedback:"say to는 tell로, 인칭대명사와 시제를 전달자에 맞춥니다. 정답은 <b>David told me that he was hungry.</b>입니다." },
  { instruction:"다음 문장을 간접화법으로 알맞게 바꾼 것을 고르세요.", sentence:"She said to me, \"Is it your scarf?\"", hint:"", answer:"She asked me if it was my scarf.", options:["She asked me if it was my scarf.","She asked me that it was my scarf.","She asked me is it your scarf.","She asked me if it is my scarf."], feedback:"의문사 없는 의문문의 간접화법은 「ask+목적어+if+주어+동사」입니다. 정답은 <b>She asked me if it was my scarf.</b>입니다." },
  { instruction:"다음 문장을 간접화법으로 알맞게 바꾼 것을 고르세요.", sentence:"Eric said to me, \"What are you doing?\"", hint:"", answer:"Eric asked me what I was doing.", options:["Eric asked me what I was doing.","Eric asked me what was I doing.","Eric asked me if I was doing.","Eric asked me what you are doing."], feedback:"의문사가 있는 의문문의 간접화법은 「ask+목적어+의문사+주어+동사」입니다. 정답은 <b>Eric asked me what I was doing.</b>입니다." },
  { instruction:"다음 문장을 간접화법으로 알맞게 바꾼 것을 고르세요.", sentence:"My mother said, \"Who broke the vase?\"", hint:"", answer:"My mother asked who had broken the vase.", options:["My mother asked who had broken the vase.","My mother asked who broke the vase did.","My mother asked broke who the vase.","My mother asked if who broke the vase."], feedback:"의문사가 주어인 경우 「의문사+동사」 어순을 유지합니다. 정답은 <b>My mother asked who had broken the vase.</b>입니다." },
  { instruction:"다음 문장에서 어법상 틀린 것을 고르세요.", sentence:"다음 중 어법상 틀린 문장은?", hint:"", answer:"The teacher says that light moved faster than sound.", options:["The teacher says that light moved faster than sound.","I realize that a friend in need is a friend indeed.","We learn that oil is lighter than water.","Children knew that bears slept all winter."], feedback:"변하지 않는 과학적 사실은 항상 현재시제를 씁니다. 'light moves faster than sound'로 고쳐야 합니다." },
  { instruction:"다음 문장을 직접화법으로 알맞게 바꾼 것을 고르세요.", sentence:"He asked us what time our flight left.", hint:"", answer:"He asked us, \"What time does your flight leave?\"", options:["He asked us, \"What time does your flight leave?\"","He asked us, \"What time our flight left?\"","He asked us, \"What time does our flight leave?\"","He asked us, \"What time your flight leaves?\""], feedback:"간접화법을 직접화법으로 바꿀 때 인칭대명사(our→your)와 의문문 어순으로 복원합니다. 정답은 <b>He asked us, \"What time does your flight leave?\"</b>입니다." },
  { instruction:"( ) 안의 말을 배열할 때 3번째로 오는 단어를 고르세요.", sentence:"나는 우리가 어느 출구를 이용해야 할지 모르겠다.\nI'm not sure (should, which, we, exit, use).", hint:"", answer:"we", options:["we","which","should","exit"], feedback:"완성된 문장은 'I'm not sure which exit we should use.'입니다. 3번째 단어는 <b>we</b>입니다." }
];
const IS_C = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function shuffleNoFirstAnswer(arr, answer) {
  let result; let tries = 0;
  do { result = shuffle(arr); tries++; }
  while (result[0].toLowerCase() === answer.toLowerCase() && tries < 20);
  return result;
}
let questions = [], current = 0, score = 0, wrongIndexes = [], isWrongRetry = false;
function startQuiz(qs) {
  questions = qs; current = 0; score = 0; wrongIndexes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('resultScreen').style.display = 'none';
  showQuestion();
}
function showQuestion() {
  const q = questions[current], total = questions.length;
  document.getElementById('qnum').textContent = `${current + 1} / ${total}`;
  document.getElementById('progressBar').style.width = `${(current / total) * 100}%`;
  document.getElementById('cardInstruction').textContent = q.instruction;
  document.getElementById('sentenceBox').innerHTML = q.sentence.replace(/\n/g, '<br>');
  document.getElementById('hint').style.display = 'none';
  const fb = document.getElementById('feedback');
  fb.style.display = 'none'; fb.className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';
  const grid = document.getElementById('optsGrid');
  grid.innerHTML = '';
  shuffleNoFirstAnswer(q.options, q.answer).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn'; btn.textContent = opt;
    btn.onclick = () => selectAnswer(opt, btn);
    grid.appendChild(btn);
  });
}
function selectAnswer(selected, clickedBtn) {
  const q = questions[current];
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
  });
  const fb = document.getElementById('feedback');
  const isCorrect = selected.toLowerCase() === q.answer.toLowerCase();
  if (isCorrect) { score++; clickedBtn.classList.add('correct'); fb.className = 'feedback correct'; document.getElementById('fbTitle').textContent = '✅ 정답!'; }
  else { clickedBtn.classList.add('wrong'); fb.className = 'feedback wrong'; document.getElementById('fbTitle').textContent = '❌ 오답'; wrongIndexes.push(current); }
  document.getElementById('fbBody').innerHTML = q.feedback;
  fb.style.display = 'block';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = current + 1 < questions.length ? '다음 문제 →' : '결과 보기 🏁';
}
function nextQuestion() { current++; if (current < questions.length) showQuestion(); else showResult(); }
function showResult() {
  document.getElementById('quizCard').style.display = 'none';
  const rs = document.getElementById('resultScreen'); rs.style.display = 'block';
  const total = questions.length, pct = score / total;
  document.getElementById('resultStars').textContent = pct >= 0.9 ? '⭐⭐⭐' : pct >= 0.6 ? '⭐⭐' : '⭐';
  document.getElementById('resultScore').textContent = `${score} / ${total} 정답`;
  document.getElementById('resultSub').textContent = pct >= 0.9 ? '완벽해요! 내신TEST 만점 도전! 🎉' : pct >= 0.6 ? '잘했어요! 조금만 더 연습해봐요.' : '다시 한번 도전해봐요!';
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('retryWrongBtn').style.display = wrongIndexes.length > 0 ? 'block' : 'none';
}
function retryAll() { isWrongRetry = false; startQuiz(shuffle([...ALL_QUESTIONS])); }
function retryWrong() { if (!wrongIndexes.length) return; isWrongRetry = true; startQuiz(shuffle(wrongIndexes.map(i => questions[i]))); }
startQuiz(shuffle([...ALL_QUESTIONS]));
</script>
</body>
</html>
