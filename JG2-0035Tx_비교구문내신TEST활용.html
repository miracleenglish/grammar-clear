<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JG2-0035Tx 비교구문 내신TEST</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF6F1; --green: #1E5A46; --green-dark: #16432F;
    --mint: #4CAF93; --mint-light: #E7F7F0;
    --coral: #E8604C; --coral-light: #FDEAE6;
    --badge-test: #E8604C;
    --card-bg: #fff; --text: #1a1a1a; --gray: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'Noto Sans KR', 'Nunito', sans-serif; color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 16px; padding-bottom: 40px; }
  .app { width: 100%; max-width: 480px; }
  .header { text-align: center; margin-bottom: 18px; padding-top: 8px; }
  .header-badges { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .badge-track { font-size: 11.5px; font-weight: 800; background: var(--badge-test); color: #fff; padding: 3px 10px; border-radius: 999px; }
  .badge-type { font-size: 11.5px; font-weight: 800; background: var(--badge-test); color: #fff; padding: 3px 10px; border-radius: 999px; }
  h1 { font-size: 19px; font-weight: 800; color: var(--green); line-height: 1.3; }
  .progress-wrap { height: 12px; border-radius: 999px; background: #d4ece3; box-shadow: inset 0 0 0 2px #b8dece; margin: 14px 0 18px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--mint), var(--green)); transition: width 0.4s ease; }
  .card { background: var(--card-bg); border-radius: 20px; padding: 22px 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.10); }
  .qnum { font-size: 13px; color: #999; margin-bottom: 6px; }
  .card-instruction { font-size: 16.5px; color: #555; margin-bottom: 12px; line-height: 1.5; }
  .sentence-box { font-size: 19px; font-family: 'Nunito', sans-serif; font-weight: 700; line-height: 1.65; background: var(--bg); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; color: var(--green-dark); }
  .sentence-box .blank { display: inline-block; border-bottom: 3px solid var(--green); min-width: 72px; text-align: center; color: var(--green); font-weight: 800; }
  .sentence-box .hl { text-decoration: underline; text-decoration-thickness: 2.5px; text-underline-offset: 5px; text-decoration-color: var(--green-dark); }
  .hint { font-size: 16px; color: #666; line-height: 1.5; margin-bottom: 16px; display: none; }
  .opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .opt-btn { font-size: 15.5px; font-weight: 700; font-family: 'Nunito', 'Noto Sans KR', sans-serif; padding: 14px 8px; border-radius: 14px; border: 2.5px solid #b8dece; background: #fff; color: var(--text); cursor: pointer; transition: all 0.15s; text-align: center; line-height: 1.3; }
  .opt-btn:hover:not(:disabled) { background: var(--bg); border-color: var(--mint); }
  .opt-btn.correct { background: var(--mint-light); border-color: var(--mint); color: #2E8064; }
  .opt-btn.wrong { background: var(--coral-light); border-color: var(--coral); color: #B84534; }
  .opt-btn:disabled { cursor: default; }
  .feedback { display: none; border-radius: 14px; padding: 14px; margin-bottom: 14px; font-size: 15.5px; line-height: 1.6; }
  .feedback.correct { background: var(--mint-light); color: #2E8064; }
  .feedback.wrong { background: var(--coral-light); color: #B84534; }
  .fb-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .next-btn { width: 100%; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 800; font-family: 'Noto Sans KR', sans-serif; background: var(--green); color: #fff; border: none; cursor: pointer; display: none; transition: background 0.2s; }
  .next-btn:hover { background: var(--green-dark); }
  .result-screen { display: none; background: var(--card-bg); border-radius: 20px; padding: 36px 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.10); text-align: center; }
  .result-stars { font-size: 44px; margin-bottom: 12px; }
  .result-score { font-size: 18px; font-weight: 800; color: var(--green); margin-bottom: 6px; }
  .result-sub { font-size: 13.5px; color: var(--gray); margin-bottom: 24px; }
  .result-btns { display: flex; flex-direction: column; gap: 10px; }
  .result-btn { padding: 14px; border-radius: 14px; font-size: 15.5px; font-weight: 800; font-family: 'Noto Sans KR', sans-serif; border: none; cursor: pointer; transition: all 0.2s; }
  .btn-retry { background: var(--green); color: #fff; }
  .btn-retry:hover { background: var(--green-dark); }
  .btn-wrong { background: var(--coral-light); color: var(--coral); border: 2px solid var(--coral); }
  .btn-wrong:hover { background: #f9d4ce; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-badges">
      <span class="badge-track">활용</span>
      <span class="badge-type">내신TEST</span>
    </div>
    <h1>JG2-0035Tx · 비교구문 내신TEST</h1>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="card" id="quizCard">
    <div class="qnum" id="qnum">1 / 20</div>
    <div class="card-instruction" id="cardInstruction"></div>
    <div class="sentence-box" id="sentenceBox"></div>
    <div class="hint" id="hint"></div>
    <div class="opts-grid" id="optsGrid"></div>
    <div class="feedback" id="feedback">
      <div class="fb-title" id="fbTitle"></div>
      <div id="fbBody"></div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()"></button>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="result-stars" id="resultStars"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-btns">
      <button class="result-btn btn-retry" onclick="retryAll()">🔄 전체 다시 풀기</button>
      <button class="result-btn btn-wrong" id="retryWrongBtn" onclick="retryWrong()">❌ 오답만 다시 풀기</button>
    </div>
  </div>
</div>
<script>
const ALL_QUESTIONS = [
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"A: How's the weather today?\nB: It's <span class='blank'> ? </span> than yesterday.", hint:"", answer:"better", options:["better","best","good","more"], feedback:"good의 비교급은 불규칙 변화로 better입니다. 정답은 <b>better</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"How about this one? It is the <span class='blank'> ? </span> one in this shop.", hint:"", answer:"most popular", options:["most popular","popularest","more popular","popular"], feedback:"3음절 이상 단어의 최상급은 「the most+단어」입니다. 정답은 <b>most popular</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"This travel app is as <span class='blank'> ? </span> a guide book.", hint:"", answer:"useful as", options:["useful as","more useful as","the most useful","useful"], feedback:"원급 비교는 「as+원급+as」입니다. 정답은 <b>useful as</b>입니다." },
  { instruction:"빈칸에 들어갈 수 없는 것을 고르세요.", sentence:"They're <span class='blank'> ? </span> cheaper.", hint:"", answer:"very", options:["very","a lot","much","even"], feedback:"very는 비교급을 수식할 수 없습니다. 비교급 강조는 much, even, still, far, a lot 등을 씁니다. 정답은 <b>very</b>입니다." },
  { instruction:"빈칸에 들어갈 말이 순서대로 알맞게 짝지어진 것을 고르세요.", sentence:"A: Who runs <span class='blank'> ? </span>, you or Tom?\nB: Tom runs twice as <span class='blank'> ? </span> as me.", hint:"", answer:"faster - fast", options:["faster - fast","fast - fast","fast - faster","faster - faster"], feedback:"두 대상을 비교할 때는 비교급, 배수사 비교는 「배수사+as+원급+as」입니다. 정답은 <b>faster - fast</b>입니다." },
  { instruction:"빈칸에 들어갈 말이 순서대로 알맞게 짝지어진 것을 고르세요.", sentence:"· The younger you are, the <span class='blank'> ? </span> it is to learn a foreign language.\n· The elephant is the <span class='blank'> ? </span> animal in this zoo.", hint:"", answer:"easier - largest", options:["easier - largest","easy - larger","easier - larger","easiest - larger"], feedback:"「the+비교급, the+비교급」과 최상급 표현입니다. 정답은 <b>easier - largest</b>입니다." },
  { instruction:"다음 대화 중 자연스럽지 않은 것을 고르세요.", sentence:"다음 중 자연스럽지 않은 것은?", hint:"", answer:"A: Do you like your new dishwasher? B: No. It takes twice as much time as my old one.", options:["A: Do you like your new dishwasher? B: No. It takes twice as much time as my old one.","A: Which bag do you want? B: A big one. The bigger, the better.","A: It's getting hotter and hotter. B: That's because winter is coming.","A: Who is taller, Hal or Adam? B: I think Hal is taller than Adam."], feedback:"겨울이 온다면 점점 추워져야 자연스럽습니다. 'hotter and hotter'와 'winter is coming'은 논리적으로 맞지 않습니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"China is not <span class='blank'> ? </span> as Canada.", hint:"", answer:"as large", options:["as large","large as","larger as","the largest"], feedback:"원급 비교의 부정형은 「not as+원급+as」입니다. 정답은 <b>as large</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"Baseball is <span class='blank'> ? </span> soccer in Korea.", hint:"", answer:"as popular as", options:["as popular as","popular as","as popular","more popular as"], feedback:"「as+원급+as」는 '~만큼 …한'이라는 뜻입니다. 정답은 <b>as popular as</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"His bag is more <span class='blank'> ? </span> than mine.", hint:"", answer:"colorful", options:["colorful","colorfuler","more colorful","colorfulest"], feedback:"-ful로 끝나는 단어의 비교급은 「more+단어」입니다. 정답은 <b>colorful</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"Who can jump <span class='blank'> ? </span> in our school?", hint:"", answer:"the farthest", options:["the farthest","the farther","far","farther"], feedback:"far의 최상급(거리)은 불규칙 변화로 farthest입니다. 정답은 <b>the farthest</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"This yellow umbrella is much <span class='blank'> ? </span> than that black one.", hint:"", answer:"better", options:["better","best","more good","gooder"], feedback:"good의 비교급은 불규칙 변화로 better입니다. 정답은 <b>better</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"This book is <span class='blank'> ? </span> my book.", hint:"", answer:"three times thicker than", options:["three times thicker than","three times as thick than","thicker three times than","three time thicker than"], feedback:"「배수사+비교급+than」의 어순입니다. 정답은 <b>three times thicker than</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"David finished the work <span class='blank'> ? </span> you.", hint:"", answer:"three times as fast as", options:["three times as fast as","three times faster as","as three times fast as","three time as fast as"], feedback:"「배수사+as+원급+as」의 어순입니다. 정답은 <b>three times as fast as</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"More and more people are using social networking sites.\n= <span class='blank'> ? </span> people are using social networking sites.", hint:"", answer:"More and more", options:["More and more","Many and many","More more","The more"], feedback:"「비교급+and+비교급」은 '점점 더'라는 뜻입니다. 정답은 <b>More and more</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"Because of the noise, Judy's voice got <span class='blank'> ? </span>.", hint:"", answer:"louder and louder", options:["louder and louder","loud and loud","more loud and loud","loud and louder"], feedback:"「비교급+and+비교급」입니다. 정답은 <b>louder and louder</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"Fried chicken is <span class='blank'> ? </span> foods in Korea.", hint:"", answer:"one of the most popular", options:["one of the most popular","one of the popular","the most popular one of","one of most popular"], feedback:"「one of the+최상급+복수명사」입니다. 정답은 <b>one of the most popular</b>입니다." },
  { instruction:"빈칸에 알맞은 것을 고르세요.", sentence:"No sport is <span class='blank'> ? </span> than speed skating.", hint:"", answer:"more exciting", options:["more exciting","as exciting","excitinger","the most exciting"], feedback:"「No (other)+단수명사 ~ 비교급+than」은 '어떤 ~도 …보다 더 하지 않은'이라는 뜻입니다. 정답은 <b>more exciting</b>입니다." },
  { instruction:"다음 두 문장이 같은 뜻이 되도록 빈칸에 알맞은 것을 고르세요.", sentence:"History is the hardest subject.\n= No other subject is <span class='blank'> ? </span> history.", hint:"", answer:"as hard as", options:["as hard as","harder than","the hardest","hard as"], feedback:"「No (other)+단수명사 ~ as+원급+as」로 최상급을 나타낼 수 있습니다. 정답은 <b>as hard as</b>입니다." },
  { instruction:"( ) 안의 말을 배열할 때 3번째로 오는 단어를 고르세요.", sentence:"Fiji는 세계에서 가장 아름다운 섬들 중 하나이다.\nFiji is (islands, beautiful, the, most, one, of) in the world.", hint:"", answer:"the", options:["the","most","one","of"], feedback:"완성된 문장은 'Fiji is one of the most beautiful islands in the world.'입니다. 3번째 단어는 <b>the</b>입니다." }
];
const IS_C = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function shuffleNoFirstAnswer(arr, answer) {
  let result; let tries = 0;
  do { result = shuffle(arr); tries++; }
  while (result[0].toLowerCase() === answer.toLowerCase() && tries < 20);
  return result;
}
let questions = [], current = 0, score = 0, wrongIndexes = [], isWrongRetry = false;
function startQuiz(qs) {
  questions = qs; current = 0; score = 0; wrongIndexes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('resultScreen').style.display = 'none';
  showQuestion();
}
function showQuestion() {
  const q = questions[current], total = questions.length;
  document.getElementById('qnum').textContent = `${current + 1} / ${total}`;
  document.getElementById('progressBar').style.width = `${(current / total) * 100}%`;
  document.getElementById('cardInstruction').textContent = q.instruction;
  document.getElementById('sentenceBox').innerHTML = q.sentence.replace(/\n/g, '<br>');
  document.getElementById('hint').style.display = 'none';
  const fb = document.getElementById('feedback');
  fb.style.display = 'none'; fb.className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';
  const grid = document.getElementById('optsGrid');
  grid.innerHTML = '';
  shuffleNoFirstAnswer(q.options, q.answer).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn'; btn.textContent = opt;
    btn.onclick = () => selectAnswer(opt, btn);
    grid.appendChild(btn);
  });
}
function selectAnswer(selected, clickedBtn) {
  const q = questions[current];
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
  });
  const fb = document.getElementById('feedback');
  const isCorrect = selected.toLowerCase() === q.answer.toLowerCase();
  if (isCorrect) { score++; clickedBtn.classList.add('correct'); fb.className = 'feedback correct'; document.getElementById('fbTitle').textContent = '✅ 정답!'; }
  else { clickedBtn.classList.add('wrong'); fb.className = 'feedback wrong'; document.getElementById('fbTitle').textContent = '❌ 오답'; wrongIndexes.push(current); }
  document.getElementById('fbBody').innerHTML = q.feedback;
  fb.style.display = 'block';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = current + 1 < questions.length ? '다음 문제 →' : '결과 보기 🏁';
}
function nextQuestion() { current++; if (current < questions.length) showQuestion(); else showResult(); }
function showResult() {
  document.getElementById('quizCard').style.display = 'none';
  const rs = document.getElementById('resultScreen'); rs.style.display = 'block';
  const total = questions.length, pct = score / total;
  document.getElementById('resultStars').textContent = pct >= 0.9 ? '⭐⭐⭐' : pct >= 0.6 ? '⭐⭐' : '⭐';
  document.getElementById('resultScore').textContent = `${score} / ${total} 정답`;
  document.getElementById('resultSub').textContent = pct >= 0.9 ? '완벽해요! 내신TEST 만점 도전! 🎉' : pct >= 0.6 ? '잘했어요! 조금만 더 연습해봐요.' : '다시 한번 도전해봐요!';
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('retryWrongBtn').style.display = wrongIndexes.length > 0 ? 'block' : 'none';
}
function retryAll() { isWrongRetry = false; startQuiz(shuffle([...ALL_QUESTIONS])); }
function retryWrong() { if (!wrongIndexes.length) return; isWrongRetry = true; startQuiz(shuffle(wrongIndexes.map(i => questions[i]))); }
startQuiz(shuffle([...ALL_QUESTIONS]));
</script>
</body>
</html>
