<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JG1-0013 관사</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#EAF6F1;--green:#1E5A46;--green-dark:#16432F;--mint:#4CAF93;--mint-light:#E7F7F0;--coral:#E8604C;--coral-light:#FDEAE6;--badge-basic:#4A90D9;--card-bg:#fff;--text:#1a1a1a;--gray:#888;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:'Noto Sans KR','Nunito',sans-serif;color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:16px;padding-bottom:40px;}
  .app{width:100%;max-width:480px;}
  .header{text-align:center;margin-bottom:18px;padding-top:8px;}
  .header-badges{display:flex;justify-content:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .badge-track,.badge-type{font-size:11.5px;font-weight:800;background:var(--badge-basic);color:#fff;padding:3px 10px;border-radius:999px;}
  h1{font-size:19px;font-weight:800;color:var(--green);line-height:1.3;}
  .progress-wrap{height:12px;border-radius:999px;background:#d4ece3;box-shadow:inset 0 0 0 2px #b8dece;margin:14px 0 18px;overflow:hidden;}
  .progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--green));transition:width 0.4s ease;}
  .card{background:var(--card-bg);border-radius:20px;padding:22px 18px;box-shadow:0 4px 16px rgba(0,0,0,0.10);}
  .qnum{font-size:13px;color:#999;margin-bottom:6px;}
  .card-instruction{font-size:16.5px;color:#555;margin-bottom:12px;line-height:1.5;}
  .sentence-box{font-size:23px;font-family:'Nunito',sans-serif;font-weight:700;line-height:1.65;background:var(--bg);border-radius:12px;padding:14px 16px;margin-bottom:10px;color:var(--green-dark);}
  .sentence-box .blank{display:inline-block;border-bottom:3px solid var(--green);min-width:60px;text-align:center;color:var(--green);font-weight:800;}
  .hint{font-size:16px;color:#666;line-height:1.5;margin-bottom:16px;}
  .opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .opt-btn{font-size:18px;font-weight:700;font-family:'Nunito','Noto Sans KR',sans-serif;padding:14px 8px;border-radius:14px;border:2.5px solid #b8dece;background:#fff;color:var(--text);cursor:pointer;transition:all 0.15s;text-align:center;line-height:1.3;}
  .opt-btn:hover:not(:disabled){background:var(--bg);border-color:var(--mint);}
  .opt-btn.correct{background:var(--mint-light);border-color:var(--mint);color:#2E8064;}
  .opt-btn.wrong{background:var(--coral-light);border-color:var(--coral);color:#B84534;}
  .opt-btn:disabled{cursor:default;}
  .feedback{display:none;border-radius:14px;padding:14px;margin-bottom:14px;font-size:15.5px;line-height:1.6;}
  .feedback.correct{background:var(--mint-light);color:#2E8064;}
  .feedback.wrong{background:var(--coral-light);color:#B84534;}
  .fb-title{font-size:15px;font-weight:800;margin-bottom:4px;}
  .next-btn{width:100%;padding:14px;border-radius:14px;font-size:16px;font-weight:800;font-family:'Noto Sans KR',sans-serif;background:var(--green);color:#fff;border:none;cursor:pointer;display:none;transition:background 0.2s;}
  .next-btn:hover{background:var(--green-dark);}
  .result-screen{display:none;background:var(--card-bg);border-radius:20px;padding:36px 18px;box-shadow:0 4px 16px rgba(0,0,0,0.10);text-align:center;}
  .result-stars{font-size:44px;margin-bottom:12px;}
  .result-score{font-size:18px;font-weight:800;color:var(--green);margin-bottom:6px;}
  .result-sub{font-size:13.5px;color:var(--gray);margin-bottom:24px;}
  .result-btns{display:flex;flex-direction:column;gap:10px;}
  .result-btn{padding:14px;border-radius:14px;font-size:15.5px;font-weight:800;font-family:'Noto Sans KR',sans-serif;border:none;cursor:pointer;transition:all 0.2s;}
  .btn-retry{background:var(--green);color:#fff;}
  .btn-retry:hover{background:var(--green-dark);}
  .btn-wrong{background:var(--coral-light);color:var(--coral);border:2px solid var(--coral);}
  .btn-wrong:hover{background:#f9d4ce;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-badges">
      <span class="badge-track">기본</span>
      <span class="badge-type">A형</span>
    </div>
    <h1>JG1-0013 · 관사</h1>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="card" id="quizCard">
    <div class="qnum" id="qnum">1 / 12</div>
    <div class="card-instruction" id="cardInstruction"></div>
    <div class="sentence-box" id="sentenceBox"></div>
    <div class="hint" id="hint"></div>
    <div class="opts-grid" id="optsGrid"></div>
    <div class="feedback" id="feedback">
      <div class="fb-title" id="fbTitle"></div>
      <div id="fbBody"></div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()"></button>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="result-stars" id="resultStars"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-btns">
      <button class="result-btn btn-retry" onclick="retryAll()">🔄 전체 다시 풀기</button>
      <button class="result-btn btn-wrong" id="retryWrongBtn" onclick="retryWrong()">❌ 오답만 다시 풀기</button>
    </div>
  </div>
</div>
<script>
const ALL_QUESTIONS = [
  // ── a / an ──
  {
    instruction: "빈칸에 알맞은 부정관사를 고르세요.",
    sentence: "I saw <span class='blank'>  ?  </span> movie last night.",
    hint: "나는 어젯밤 영화를 봤다.",
    answer: "a",
    options: ["a", "an", "the", "없음"],
    feedback: "막연한 하나를 나타내고 뒤에 오는 단어(movie)의 발음이 자음으로 시작하므로 <b>a</b>를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 부정관사를 고르세요.",
    sentence: "She is <span class='blank'>  ?  </span> engineer.",
    hint: "그녀는 엔지니어이다.",
    answer: "an",
    options: ["a", "an", "the", "없음"],
    feedback: "막연한 하나를 나타내고 뒤에 오는 단어(engineer)의 발음이 모음으로 시작하므로 <b>an</b>을 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 부정관사를 고르세요.",
    sentence: "I have <span class='blank'>  ?  </span> idea.",
    hint: "나는 아이디어가 하나 있다.",
    answer: "an",
    options: ["a", "an", "the", "없음"],
    feedback: "idea의 발음이 모음(/아이/)으로 시작하므로 <b>an</b>을 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 부정관사를 고르세요.",
    sentence: "He bought <span class='blank'>  ?  </span> new car.",
    hint: "그는 새 차를 샀다.",
    answer: "a",
    options: ["a", "an", "the", "없음"],
    feedback: "new의 발음이 자음(/뉴/)으로 시작하므로 <b>a</b>를 씁니다."
  },
  // ── the ──
  {
    instruction: "빈칸에 알맞은 관사를 고르세요.",
    sentence: "He bought a new car. <span class='blank'>  ?  </span> car is fast.",
    hint: "그는 새 차를 샀다. 그 차는 빠르다.",
    answer: "The",
    options: ["A", "An", "The", "없음"],
    feedback: "앞서 이미 나온 명사를 다시 가리킬 때는 정관사 <b>The</b>를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 관사를 고르세요.",
    sentence: "Please open <span class='blank'>  ?  </span> door.",
    hint: "문 좀 열어 주세요.",
    answer: "the",
    options: ["a", "an", "the", "없음"],
    feedback: "서로 알고 있는 특정한 것(the door)을 가리킬 때는 <b>the</b>를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 관사를 고르세요.",
    sentence: "<span class='blank'>  ?  </span> sun rises in the east.",
    hint: "태양은 동쪽에서 뜬다.",
    answer: "The",
    options: ["A", "An", "The", "없음"],
    feedback: "하나뿐인 존재(태양)를 나타낼 때는 <b>The</b>를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 관사를 고르세요.",
    sentence: "I play <span class='blank'>  ?  </span> violin.",
    hint: "나는 바이올린을 연주한다.",
    answer: "the",
    options: ["a", "an", "the", "없음"],
    feedback: "악기 이름 앞에는 <b>the</b>를 씁니다."
  },
  // ── 관사 없음 ──
  {
    instruction: "빈칸에 알맞은 관사를 고르세요.",
    sentence: "She goes to <span class='blank'>  ?  </span> school by bus.",
    hint: "그녀는 버스로 학교에 간다.",
    answer: "없음",
    options: ["a", "an", "the", "없음"],
    feedback: "본래의 용도로 쓰이는 장소(학교에 다니다) 앞에는 관사를 쓰지 않습니다. go to school(학교에 다니다)"
  },
  {
    instruction: "빈칸에 알맞은 관사를 고르세요.",
    sentence: "I play <span class='blank'>  ?  </span> basketball after school.",
    hint: "나는 방과 후에 농구를 한다.",
    answer: "없음",
    options: ["a", "an", "the", "없음"],
    feedback: "운동 경기 이름 앞에는 관사를 쓰지 않습니다."
  },
  {
    instruction: "빈칸에 알맞은 관사를 고르세요.",
    sentence: "I go to work by <span class='blank'>  ?  </span> taxi.",
    hint: "나는 택시로 출근한다.",
    answer: "없음",
    options: ["a", "an", "the", "없음"],
    feedback: "교통수단 앞에 by를 쓸 때는 관사를 쓰지 않습니다. by taxi(택시로)"
  },
  {
    instruction: "빈칸에 알맞은 관사를 고르세요.",
    sentence: "He surfs <span class='blank'>  ?  </span> Internet every day.",
    hint: "그는 매일 인터넷을 서핑한다.",
    answer: "the",
    options: ["a", "an", "the", "없음"],
    feedback: "Internet(인터넷) 앞에는 관용적으로 <b>the</b>를 씁니다."
  }
];

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleNoFirstAnswer(arr,answer){let result;let tries=0;do{result=shuffle(arr);tries++;}while(result[0].toLowerCase()===answer.toLowerCase()&&tries<20);return result;}
let questions=[],current=0,score=0,wrongIndexes=[];
function startQuiz(qs){questions=qs;current=0;score=0;wrongIndexes=[];document.getElementById('quizCard').style.display='';document.getElementById('resultScreen').style.display='none';showQuestion();}
function showQuestion(){const q=questions[current],total=questions.length;document.getElementById('qnum').textContent=`${current+1} / ${total}`;document.getElementById('progressBar').style.width=`${(current/total)*100}%`;document.getElementById('cardInstruction').textContent=q.instruction;document.getElementById('sentenceBox').innerHTML=q.sentence;document.getElementById('hint').textContent='💡 '+q.hint;const fb=document.getElementById('feedback');fb.style.display='none';fb.className='feedback';document.getElementById('nextBtn').style.display='none';const grid=document.getElementById('optsGrid');grid.innerHTML='';shuffleNoFirstAnswer(q.options,q.answer).forEach(opt=>{const btn=document.createElement('button');btn.className='opt-btn';btn.textContent=opt;btn.onclick=()=>selectAnswer(opt,btn);grid.appendChild(btn);});}
function selectAnswer(selected,clickedBtn){const q=questions[current];document.querySelectorAll('.opt-btn').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct');});const fb=document.getElementById('feedback');const isCorrect=selected.toLowerCase()===q.answer.toLowerCase();if(isCorrect){score++;clickedBtn.classList.add('correct');fb.className='feedback correct';document.getElementById('fbTitle').textContent='✅ 정답!';}else{clickedBtn.classList.add('wrong');fb.className='feedback wrong';document.getElementById('fbTitle').textContent='❌ 오답';wrongIndexes.push(current);}document.getElementById('fbBody').innerHTML=q.feedback;fb.style.display='block';const nextBtn=document.getElementById('nextBtn');nextBtn.style.display='block';nextBtn.textContent=current+1<questions.length?'다음 문제 →':'결과 보기 🏁';}
function nextQuestion(){current++;if(current<questions.length)showQuestion();else showResult();}
function showResult(){document.getElementById('quizCard').style.display='none';const rs=document.getElementById('resultScreen');rs.style.display='block';const total=questions.length,pct=score/total;document.getElementById('resultStars').textContent=pct>=0.9?'⭐⭐⭐':pct>=0.6?'⭐⭐':'⭐';document.getElementById('resultScore').textContent=`${score} / ${total} 정답`;document.getElementById('resultSub').textContent=pct>=0.9?'완벽해요! 관사 마스터! 🎉':pct>=0.6?'잘했어요! 조금만 더 연습해봐요.':'다시 한번 도전해봐요!';document.getElementById('progressBar').style.width='100%';document.getElementById('retryWrongBtn').style.display=wrongIndexes.length>0?'block':'none';}
function retryAll(){startQuiz(shuffle([...ALL_QUESTIONS]));}
function retryWrong(){if(!wrongIndexes.length)return;startQuiz(shuffle(wrongIndexes.map(i=>questions[i])));}
startQuiz(shuffle([...ALL_QUESTIONS]));
</script>
</body>
</html>
