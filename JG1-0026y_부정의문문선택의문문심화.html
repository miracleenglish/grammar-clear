<head>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#EAF6F1;--green:#1E5A46;--green-dark:#16432F;--mint:#4CAF93;--mint-light:#E7F7F0;--coral:#E8604C;--coral-light:#FDEAE6;--badge-basic:#4A90D9;--badge-b:#5BAD6F;--badge-c:#9B6DD1;--badge-deep:#9B6DD1;--badge-sub:#E07B39;--badge-test:#E8604C;--card-bg:#fff;--text:#1a1a1a;--gray:#888;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:'Noto Sans KR','Nunito',sans-serif;color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:16px;padding-bottom:40px;}
  .app{width:100%;max-width:480px;}
  .header{text-align:center;margin-bottom:18px;padding-top:8px;}
  .header-badges{display:flex;justify-content:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .badge-track{font-size:11.5px;font-weight:800;background:var(--badge-deep);color:#fff;padding:3px 10px;border-radius:999px;}
  .badge-type-mix{font-size:11.5px;font-weight:800;background:var(--badge-deep);color:#fff;padding:3px 10px;border-radius:999px;}
  .badge-type-c{font-size:11.5px;font-weight:800;background:var(--badge-c);color:#fff;padding:3px 10px;border-radius:999px;}
  .badge-type-test{font-size:11.5px;font-weight:800;background:var(--badge-test);color:#fff;padding:3px 10px;border-radius:999px;}
  .badge-sub{font-size:11.5px;font-weight:800;background:var(--badge-sub);color:#fff;padding:3px 10px;border-radius:999px;}
  h1{font-size:19px;font-weight:800;color:var(--green);line-height:1.3;}
  .progress-wrap{height:12px;border-radius:999px;background:#d4ece3;box-shadow:inset 0 0 0 2px #b8dece;margin:14px 0 18px;overflow:hidden;}
  .progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--green));transition:width 0.4s ease;}
  .card{background:var(--card-bg);border-radius:20px;padding:22px 18px;box-shadow:0 4px 16px rgba(0,0,0,0.10);}
  .qnum{font-size:13px;color:#999;margin-bottom:6px;}
  .qnum .tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;}
  .qnum .tag.mc{background:var(--mint-light);color:#2E8064;}
  .qnum .tag.sub{background:#FCEADC;color:#B8551F;}
  .card-instruction{font-size:16.5px;color:#555;margin-bottom:12px;line-height:1.5;}
  .sentence-box{font-size:23px;font-family:'Nunito',sans-serif;font-weight:700;line-height:1.65;background:var(--bg);border-radius:12px;padding:14px 16px;margin-bottom:10px;color:var(--green-dark);}
  .sentence-box .blank{display:inline-block;border-bottom:3px solid var(--green);min-width:100px;text-align:center;color:var(--green);font-weight:800;}
  .sentence-box .hl{text-decoration:underline;text-decoration-thickness:2.5px;text-underline-offset:5px;text-decoration-color:var(--green-dark);}
  .hint{font-size:16px;color:#666;line-height:1.5;margin-bottom:16px;}
  .opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .opts-col{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .opt-btn{font-size:18px;font-weight:700;font-family:'Nunito','Noto Sans KR',sans-serif;padding:14px 8px;border-radius:14px;border:2.5px solid #b8dece;background:#fff;color:var(--text);cursor:pointer;transition:all 0.15s;text-align:center;line-height:1.3;}
  .opts-col .opt-btn{font-size:17px;padding:13px 14px;text-align:left;}
  .opt-btn:hover:not(:disabled){background:var(--bg);border-color:var(--mint);}
  .opt-btn.correct{background:var(--mint-light);border-color:var(--mint);color:#2E8064;}
  .opt-btn.wrong{background:var(--coral-light);border-color:var(--coral);color:#B84534;}
  .opt-btn:disabled{cursor:default;}
  .sub-wrap{margin-bottom:14px;}
  .sub-input{font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid #b8dece;width:100%;font-family:'Nunito','Noto Sans KR',sans-serif;}
  .sub-input:focus{outline:none;border-color:var(--badge-sub);}
  .sub-check-btn{width:100%;margin-top:10px;padding:14px;border-radius:14px;font-size:16px;font-weight:800;font-family:'Noto Sans KR',sans-serif;background:var(--badge-sub);color:#fff;border:none;cursor:pointer;}
  .sub-check-btn:hover{background:#C8661F;}
  .model-answer-box{display:none;border-radius:14px;padding:14px;margin-top:12px;background:#FCEADC;color:#7A3E12;font-size:15.5px;line-height:1.6;}

  .model-answer-box .ma-sentence{font-size:18px;font-family:'Nunito',sans-serif;font-weight:700;margin-bottom:8px;color:var(--green-dark);}
  .self-check-row{display:flex;gap:8px;margin-top:12px;}
  .self-check-row button{flex:1;padding:12px;border-radius:12px;font-size:14.5px;font-weight:800;font-family:'Noto Sans KR',sans-serif;border:2px solid #ddd;background:#fff;cursor:pointer;}

  .self-check-row button.no.active{background:var(--coral-light);border-color:var(--coral);color:#B84534;}
  .feedback{display:none;border-radius:14px;padding:14px;margin-bottom:14px;font-size:15.5px;line-height:1.6;}
  .feedback.correct{background:var(--mint-light);color:#2E8064;}
  .feedback.wrong{background:var(--coral-light);color:#B84534;}
  .fb-title{font-size:15px;font-weight:800;margin-bottom:4px;}
  .fb-sentence{font-size:17px;font-family:'Nunito',sans-serif;font-weight:700;margin-bottom:6px;}
  .fb-sentence .err{text-decoration:line-through;color:var(--coral);margin-right:4px;}
  .fb-sentence .fix{color:#2E8064;font-weight:800;}
  .next-btn{width:100%;padding:14px;border-radius:14px;font-size:16px;font-weight:800;font-family:'Noto Sans KR',sans-serif;background:var(--green);color:#fff;border:none;cursor:pointer;display:none;transition:background 0.2s;margin-top:6px;}
  .next-btn:hover{background:var(--green-dark);}
  .result-screen{display:none;background:var(--card-bg);border-radius:20px;padding:36px 18px;box-shadow:0 4px 16px rgba(0,0,0,0.10);text-align:center;}
  .result-stars{font-size:44px;margin-bottom:12px;}
  .result-score{font-size:18px;font-weight:800;color:var(--green);margin-bottom:6px;}
  .result-score-sub{font-size:15px;font-weight:700;color:var(--badge-sub);margin-bottom:6px;}
  .result-sub{font-size:13.5px;color:var(--gray);margin-bottom:24px;}
  .result-btns{display:flex;flex-direction:column;gap:10px;}
  .result-btn{padding:14px;border-radius:14px;font-size:15.5px;font-weight:800;font-family:'Noto Sans KR',sans-serif;border:none;cursor:pointer;transition:all 0.2s;}
  .btn-retry{background:var(--green);color:#fff;}
  .btn-retry:hover{background:var(--green-dark);}
  .btn-wrong{background:var(--coral-light);color:var(--coral);border:2px solid var(--coral);}
  .btn-wrong:hover{background:#f9d4ce;}
</style>

: "그는 매운 음식을 좋아하지 않니?", "modelAnswer": "Doesn't he like spicy food?", "rubric": "채점기준: Doesn't he like(동사원형)로 정확히 바꾸면 정답."}, {"type": "sub", "instruction": "우리말 뜻에 맞게 문장을 완성하세요.", "sentence": "너는 지하철로 갈래, 아니면 버스로 갈래?", "hint": "선택의문문(or)을 사용하세요.", "modelAnswer": "Will you go by subway or by bus?", "rubric": "채점기준: or로 두 선택지를 연결했으면 정답."}, {"type": "sub", "instruction": "대화의 빈칸에 알맞은 대답을 완성하세요.", "sentence": "A: Do you want tea or coffee?<br>B: ___. (커피를 원한다)", "hint": "구체적으로 대답하세요.", "modelAnswer": "I want coffee.", "rubric": "채점기준: I want coffee.처럼 Yes/No 없이 구체적으로 답하면 정답."}, {"type": "sub", "instruction": "다음 문장을 부정의문문으로 바꿔 쓰세요.", "sentence": "They finished the project.", "hint": "그들은 프로젝트를 끝내지 않았니?", "modelAnswer": "Didn't they finish the project?", "rubric": "채점기준: Didn't they finish로 정확히 바꾸면 정답."}, {"type": "sub", "instruction": "우리말 뜻에 맞게 문장을 완성하세요.", "sentence": "너는 빨간색을 좋아하니, 아니면 파란색을 좋아하니?", "hint": "Which를 사용한 선택의문문을 사용하세요.", "modelAnswer": "Which do you like, red or blue?", "rubric": "채점기준: Which do you like와 or로 연결된 선택지가 들어가면 정답."}, {"type": "sub", "instruction": "주어진 단어를 바르게 배열해 문장을 완성하세요.", "sentence": "( you / can't / swim )", "hint": "너는 수영을 못하니?", "modelAnswer": "Can't you swim?", "rubric": "채점기준: Can't you swim? 어순이 맞으면 정답."}, {"type": "sub", "instruction": "다음 문장을 부정의문문으로 바꿔 쓰세요.", "sentence": "She was at home yesterday.", "hint": "그녀는 어제 집에 있지 않았니?", "modelAnswer": "Wasn't she at home yesterday?", "rubric": "채점기준: Wasn't she로 정확히 바꾸면 정답."}, {"type": "sub", "instruction": "우리말 뜻에 맞게 문장을 완성하세요.", "sentence": "너는 걸어갈래, 아니면 뛰어갈래?", "hint": "or를 사용한 선택의문문을 사용하세요.", "modelAnswer": "Will you walk or run?", "rubric": "채점기준: or로 두 선택지를 연결했으면 정답."}];
const IS_C=false;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleNoFirstAnswer(arr,answer){let result;let tries=0;do{result=shuffle(arr);tries++;}while(result[0].toLowerCase()===answer.toLowerCase()&&tries<20);return result;}
let questions=[],current=0,mcScore=0,mcTotal=0,subOkCount=0,subTotal=0,wrongIndexes=[],selfState=null;
function startQuiz(qs){questions=qs;current=0;mcScore=0;mcTotal=0;subOkCount=0;subTotal=0;wrongIndexes=[];document.getElementById("quizCard").style.display="";document.getElementById("resultScreen").style.display="none";showQuestion();}
function showQuestion(){
  const q=questions[current],total=questions.length;
  document.getElementById("qnum").innerHTML=`${current+1} / ${total} <span class="tag ${q.type==='sub'?'sub':'mc'}">${q.type==='sub'?'서술형':'객관식'}</span>`;
  document.getElementById("progressBar").style.width=`${(current/total)*100}%`;
  document.getElementById("cardInstruction").textContent=q.instruction;
  document.getElementById("sentenceBox").innerHTML=q.sentence;
  document.getElementById("hint").textContent="💡 "+q.hint;
  const fb=document.getElementById("feedback");fb.style.display="none";fb.className="feedback";
  document.getElementById("nextBtn").style.display="none";
  const grid=document.getElementById("optsGrid");
  const subWrap=document.getElementById("subWrap");
  if(q.type==='sub'){
    grid.style.display="none";grid.innerHTML="";
    subWrap.style.display="block";
    document.getElementById("subInput").value="";
    document.getElementById("subInput").disabled=false;
    document.getElementById("subCheckBtn").style.display="block";
    document.getElementById("modelAnswerBox").style.display="none";
    document.getElementById("selfOkBtn").classList.remove("active");
    document.getElementById("selfNoBtn").classList.remove("active");
    selfState=null;
  }else{
    subWrap.style.display="none";
    grid.style.display="";grid.className="opts-grid";grid.innerHTML="";
    shuffleNoFirstAnswer(q.options,q.answer).forEach(opt=>{
      const btn=document.createElement("button");btn.className="opt-btn";btn.textContent=opt;
      btn.onclick=()=>selectAnswer(opt,btn);grid.appendChild(btn);
    });
  }
}
function selectAnswer(selected,clickedBtn){
  const q=questions[current];mcTotal++;
  document.querySelectorAll(".opt-btn").forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add("correct");});
  const fb=document.getElementById("feedback");
  const isCorrect=selected.toLowerCase()===q.answer.toLowerCase();
  if(isCorrect){mcScore++;clickedBtn.classList.add("correct");fb.className="feedback correct";document.getElementById("fbTitle").textContent="✅ 정답!";}
  else{clickedBtn.classList.add("wrong");fb.className="feedback wrong";document.getElementById("fbTitle").textContent="❌ 오답";wrongIndexes.push(current);}
  document.getElementById("fbBody").innerHTML=q.feedback;fb.style.display="block";
  const nextBtn=document.getElementById("nextBtn");nextBtn.style.display="block";
  nextBtn.textContent=current+1<questions.length?"다음 문제 →":"결과 보기 🏁";
}
function checkSub(){
  const q=questions[current];subTotal++;
  document.getElementById("subInput").disabled=true;
  document.getElementById("subCheckBtn").style.display="none";
  document.getElementById("maSentence").textContent=q.modelAnswer;
  document.getElementById("maRubric").innerHTML=q.rubric;
  document.getElementById("modelAnswerBox").style.display="block";
  const nextBtn=document.getElementById("nextBtn");nextBtn.style.display="block";
  nextBtn.textContent=current+1<questions.length?"다음 문제 →":"결과 보기 🏁";
}
function selfCheck(ok){
  selfState=ok;
  document.getElementById("selfOkBtn").classList.toggle("active",ok===true);
  document.getElementById("selfNoBtn").classList.toggle("active",ok===false);
  if(ok===true)subOkCount++; else wrongIndexes.push(current);
}
function nextQuestion(){current++;if(current<questions.length)showQuestion();else showResult();}
function showResult(){
  document.getElementById("quizCard").style.display="none";
  const rs=document.getElementById("resultScreen");rs.style.display="block";
  const pct=mcTotal>0?mcScore/mcTotal:1;
  document.getElementById("resultStars").textContent=pct>=0.9?"⭐⭐⭐":pct>=0.6?"⭐⭐":"⭐";
  document.getElementById("resultScore").textContent=`객관식 ${mcScore} / ${mcTotal} 정답`;
  document.getElementById("resultScoreSub").textContent=`서술형 자가채점 ${subOkCount} / ${subTotal}`;
  document.getElementById("resultSub").textContent=pct>=0.9?'완벽해요! 부정의문문·선택의문문 심화 마스터! 🎉':pct>=0.6?"잘했어요! 조금만 더 연습해봐요.":"다시 한번 도전해봐요!";
  document.getElementById("progressBar").style.width="100%";
  document.getElementById("retryWrongBtn").style.display=wrongIndexes.length>0?"block":"none";
}
function retryAll(){startQuiz(shuffle([...ALL_QUESTIONS]));}
function retryWrong(){if(!wrongIndexes.length)return;startQuiz(shuffle(wrongIndexes.map(i=>questions[i])));}
startQuiz(shuffle([...ALL_QUESTIONS]));
</script>
