<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JG2-0042y as if 가정법 심화</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#EAF6F1; --green:#1E5A46; --green-dark:#16432F;
  --mint:#4CAF93; --mint-light:#E7F7F0;
  --coral:#E8604C; --coral-light:#FDEAE6;
  --badge-deep-obj:#9B6DD1; --badge-deep-subj:#E07B39;
  --card-bg:#fff; --text:#1a1a1a; --gray:#888;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); font-family:'Noto Sans KR','Nunito',sans-serif; color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:16px; padding-bottom:40px; }
.app { width:100%; max-width:480px; }
.header { text-align:center; margin-bottom:18px; padding-top:8px; }
.header-badges { display:flex; justify-content:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.badge-track { font-size:11.5px; font-weight:800; background:#9B6DD1; color:#fff; padding:3px 10px; border-radius:999px; }
.badge-type { font-size:11.5px; font-weight:800; background:#9B6DD1; color:#fff; padding:3px 10px; border-radius:999px; }
h1 { font-size:19px; font-weight:800; color:var(--green); line-height:1.3; }
.progress-wrap { height:12px; border-radius:999px; background:#d4ece3; box-shadow:inset 0 0 0 2px #b8dece; margin:14px 0 18px; overflow:hidden; }
.progress-bar { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--mint),var(--green)); transition:width .4s ease; }
.card { background:var(--card-bg); border-radius:20px; padding:22px 18px; box-shadow:0 4px 16px rgba(0,0,0,0.10); }
.qnum { font-size:13px; color:#999; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
.qtype-chip { font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; }
.qtype-chip.obj { background:#EFE6FA; color:#9B6DD1; }
.qtype-chip.subj { background:#FBE9DC; color:#E07B39; }
.card-instruction { font-size:16.5px; color:#555; margin-bottom:12px; line-height:1.5; }
.sentence-box { font-size:20px; font-family:'Nunito',sans-serif; font-weight:700; line-height:1.6; background:var(--bg); border-radius:12px; padding:14px 16px; margin-bottom:10px; color:var(--green-dark); }
.sentence-box .blank { display:inline-block; min-width:72px; border-bottom:3px solid var(--green); vertical-align:bottom; margin:0 3px; }
.sentence-box .hl { text-decoration:underline; text-decoration-thickness:2.5px; text-underline-offset:5px; text-decoration-color:var(--green-dark); }
.hint { font-size:16px; color:#666; line-height:1.5; margin-bottom:16px; }
.opts-col { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
.opt-btn { font-size:17px; font-weight:700; font-family:'Nunito','Noto Sans KR',sans-serif; padding:13px 14px; border-radius:14px; border:2.5px solid #b8dece; background:#fff; color:var(--text); cursor:pointer; transition:all .15s; text-align:left; line-height:1.3; }
.opt-btn:hover:not(:disabled) { background:var(--bg); border-color:var(--mint); }
.opt-btn.correct { background:var(--mint-light); border-color:var(--mint); color:#2E8064; }
.opt-btn.wrong { background:var(--coral-light); border-color:var(--coral); color:#B84534; }
.opt-btn:disabled { cursor:default; }
.subj-input { width:100%; font-size:16px; padding:12px 14px; border-radius:12px; border:2px solid #b8dece; margin-bottom:12px; font-family:'Nunito','Noto Sans KR',sans-serif; }
.subj-check-btn { width:100%; padding:14px; border-radius:14px; font-size:16px; font-weight:800; font-family:'Noto Sans KR',sans-serif; background:var(--badge-deep-subj); color:#fff; border:none; cursor:pointer; margin-bottom:12px; }
.subj-answer-box { display:none; border-radius:14px; padding:14px; margin-bottom:14px; font-size:15.5px; line-height:1.6; background:#FBE9DC; color:#8a4a1f; }
.subj-answer-box .aa-title { font-size:15px; font-weight:800; margin-bottom:6px; color:#E07B39; }
.subj-rubric { font-size:13.5px; color:#a06630; margin-top:8px; }
.subj-selfgrade { display:none; gap:10px; margin-bottom:14px; }
.subj-selfgrade button { flex:1; padding:12px; border-radius:14px; font-size:15px; font-weight:800; border:2px solid #ccc; background:#fff; cursor:pointer; }
.subj-selfgrade .sg-correct:hover, .subj-selfgrade .sg-correct.picked { background:var(--mint-light); border-color:var(--mint); color:#2E8064; }
.subj-selfgrade .sg-wrong:hover, .subj-selfgrade .sg-wrong.picked { background:var(--coral-light); border-color:var(--coral); color:#B84534; }
.feedback { display:none; border-radius:14px; padding:14px; margin-bottom:14px; font-size:15.5px; line-height:1.6; }
.feedback.correct { background:var(--mint-light); color:#2E8064; }
.feedback.wrong { background:var(--coral-light); color:#B84534; }
.fb-title { font-size:15px; font-weight:800; margin-bottom:4px; }
.next-btn { width:100%; padding:14px; border-radius:14px; font-size:16px; font-weight:800; font-family:'Noto Sans KR',sans-serif; background:var(--green); color:#fff; border:none; cursor:pointer; display:none; transition:background .2s; }
.next-btn:hover { background:var(--green-dark); }
.result-screen { display:none; background:var(--card-bg); border-radius:20px; padding:36px 18px; box-shadow:0 4px 16px rgba(0,0,0,0.10); text-align:center; }
.result-stars { font-size:44px; margin-bottom:12px; }
.result-score { font-size:18px; font-weight:800; color:var(--green); margin-bottom:6px; }
.result-score2 { font-size:15px; font-weight:700; color:#E07B39; margin-bottom:6px; }
.result-sub { font-size:13.5px; color:var(--gray); margin-bottom:24px; }
.result-btns { display:flex; flex-direction:column; gap:10px; }
.result-btn { padding:14px; border-radius:14px; font-size:15.5px; font-weight:800; font-family:'Noto Sans KR',sans-serif; border:none; cursor:pointer; transition:all .2s; }
.btn-retry { background:var(--green); color:#fff; }
.btn-retry:hover { background:var(--green-dark); }
.btn-wrong { background:var(--coral-light); color:var(--coral); border:2px solid var(--coral); }
.btn-wrong:hover { background:#f9d4ce; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-badges">
      <span class="badge-track">심화</span>
      <span class="badge-type">혼합</span>
    </div>
    <h1>JG2-0042y · as if 가정법 심화</h1>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="card" id="quizCard">
    <div class="qnum"><span id="qnum">1 / 8</span><span class="qtype-chip" id="qtypeChip"></span></div>
    <div class="card-instruction" id="cardInstruction"></div>
    <div class="sentence-box" id="sentenceBox"></div>
    <div class="hint" id="hint"></div>
    <div class="opts-col" id="optsCol" style="display:none"></div>
    <div id="subjArea" style="display:none">
      <input type="text" class="subj-input" id="subjInput" placeholder="정답을 영어로 입력해 보세요 (자가채점용)">
      <button class="subj-check-btn" id="subjCheckBtn" onclick="revealSubjAnswer()">정답 확인하기</button>
      <div class="subj-answer-box" id="subjAnswerBox">
        <div class="aa-title">📝 모범답안</div>
        <div id="subjAnswerText"></div>
        <div class="subj-rubric" id="subjRubric"></div>
      </div>
      <div class="subj-selfgrade" id="subjSelfgrade">
        <button class="sg-correct" onclick="gradeSelf(true)">⭕ 내가 맞았어요</button>
        <button class="sg-wrong" onclick="gradeSelf(false)">❌ 내가 틀렸어요</button>
      </div>
    </div>
    <div class="feedback" id="feedback">
      <div class="fb-title" id="fbTitle"></div>
      <div id="fbBody"></div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()"></button>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="result-stars" id="resultStars"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-score2" id="resultScore2"></div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-btns">
      <button class="result-btn btn-retry" onclick="retryAll()">🔄 전체 다시 풀기</button>
      <button class="result-btn btn-wrong" id="retryWrongBtn" onclick="retryWrong()">❌ 오답만 다시 풀기</button>
    </div>
  </div>
</div>
<script>
const ALL_QUESTIONS = [
  {
    "type": "obj",
    "instruction": "빈칸에 알맞은 것을 고르세요.",
    "sentence": "She talks as if she ___ the actress very well.",
    "hint": "그녀는 마치 그 배우를 잘 아는 것처럼 말한다.",
    "options": [
      "knew",
      "knows",
      "had known",
      "will know"
    ],
    "answer": "knew",
    "feedback": "「as if+가정법 과거」는 현재 사실과 반대되는 내용을 가정하며 동사는 과거형을 씁니다. 정답은 <b>knew</b>입니다."
  },
  {
    "type": "obj",
    "instruction": "빈칸에 알맞은 것을 고르세요.",
    "sentence": "Jake looks as if he ___ sick.",
    "hint": "Jake는 마치 아팠던 적이 없었던 것처럼 보인다.(사실은 아팠음)",
    "options": [
      "had not been",
      "was not",
      "is not",
      "will not be"
    ],
    "answer": "had not been",
    "feedback": "「as if+가정법 과거완료」는 과거 사실과 반대되는 내용을 가정하며 「had v-ed」형태를 씁니다. 정답은 <b>had not been</b>입니다."
  },
  {
    "type": "obj",
    "instruction": "빈칸에 알맞은 것을 고르세요.",
    "sentence": "He acts as if he ___ the boss of this company.",
    "hint": "그는 마치 이 회사의 사장인 것처럼 행동한다.(사실은 아님)",
    "options": [
      "were",
      "is",
      "had been",
      "will be"
    ],
    "answer": "were",
    "feedback": "「as if+가정법 과거」의 be동사는 인칭에 관계없이 were를 씁니다. 정답은 <b>were</b>입니다."
  },
  {
    "type": "obj",
    "instruction": "빈칸에 알맞은 것을 고르세요.",
    "sentence": "She looked as if she ___ all night.",
    "hint": "그녀는 마치 밤새 울었던 것처럼 보였다.(과거 사실과 반대되는 과거의 추측)",
    "options": [
      "had cried",
      "cried",
      "cries",
      "would cry"
    ],
    "answer": "had cried",
    "feedback": "과거 시점에서 그보다 더 이전의 일을 반대로 가정하므로 「as if+had v-ed」를 씁니다. 정답은 <b>had cried</b>입니다."
  },
  {
    "type": "subj",
    "instruction": "우리말 뜻에 맞게 문장을 완성하세요.",
    "sentence": "Elena는 마치 우리 상사인 것처럼 행동하지만, 사실은 아니다.",
    "hint": "Elena, act, as if, our boss를 사용하세요.",
    "answer": "Elena acts as if she were our boss.",
    "rubric": "「as if+가정법 과거」이므로 be동사는 were만 정답.",
    "feedback": "as if 뒤에서도 가정법 과거의 be동사는 were를 씁니다."
  },
  {
    "type": "subj",
    "instruction": "밑줄 친 부분을 어법에 맞게 고쳐 문장을 다시 쓰세요.",
    "sentence": "Ken talks as if he <span class='hl'>visited</span> Europe, but he hasn't been there.",
    "hint": "",
    "answer": "Ken talks as if he had visited Europe, but he hasn't been there.",
    "rubric": "실제로는 유럽에 간 적이 없다는 과거 사실과 반대되는 내용이므로 had visited(가정법 과거완료)만 정답.",
    "feedback": "과거의 경험과 반대되는 내용을 가정할 때는 「as if+had v-ed」를 씁니다."
  },
  {
    "type": "subj",
    "instruction": "다음 문장을 as if를 사용한 문장으로 바꿔 쓰세요.",
    "sentence": "In fact, he doesn't understand the situation, but he speaks confidently.",
    "hint": "",
    "answer": "He speaks as if he understood the situation.",
    "rubric": "「as if+가정법 과거(understood)」형태가 정확해야 정답.",
    "feedback": "현재 사실과 반대되는 내용을 가정할 때는 「as if+가정법 과거」를 씁니다."
  },
  {
    "type": "subj",
    "instruction": "우리말 뜻에 맞게 문장을 완성하세요.",
    "sentence": "그 강아지는 마치 주인을 잃어버렸던 것처럼(그러나 실제로는 잃어버리지 않았음) 슬퍼 보였다.",
    "hint": "the puppy, look sad, as if, lose, its owner를 사용하세요.",
    "answer": "The puppy looked sad as if it had lost its owner.",
    "rubric": "과거 사실과 반대되는 가정이므로 「as if+had lost」(가정법 과거완료)가 반드시 있어야 정답.",
    "feedback": "과거 시점보다 더 이전의 일을 반대로 가정할 때는 「as if+had v-ed」를 씁니다."
  }
];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function shuffleNoFirstAnswer(arr, answer) {
  let result; let tries = 0;
  do { result = shuffle(arr); tries++; }
  while (result[0].toLowerCase() === answer.toLowerCase() && tries < 20);
  return result;
}
let questions = [], current = 0, objScore = 0, objTotal = 0, subjDone = 0, subjCorrectSelf = 0, subjTotal = 0, wrongIndexes = [];
function startQuiz(qs) {
  questions = qs; current = 0; objScore = 0; objTotal = 0; subjDone = 0; subjCorrectSelf = 0; subjTotal = 0; wrongIndexes = [];
  document.getElementById('quizCard').style.display = '';
  document.getElementById('resultScreen').style.display = 'none';
  showQuestion();
}
function showQuestion() {
  const q = questions[current], total = questions.length;
  document.getElementById('qnum').textContent = `${current + 1} / ${total}`;
  document.getElementById('qtypeChip').textContent = q.type === 'obj' ? '객관식' : '주관식';
  document.getElementById('qtypeChip').className = 'qtype-chip ' + q.type;
  document.getElementById('progressBar').style.width = `${(current / total) * 100}%`;
  document.getElementById('cardInstruction').textContent = q.instruction;
  document.getElementById('sentenceBox').innerHTML = q.sentence.replace(/___/g,
    '<span class="blank">&nbsp;</span>').replace(/\n/g, '<br>');
  const hintEl = document.getElementById('hint');
  if (q.hint) { hintEl.style.display = ''; hintEl.innerHTML = '💡 ' + q.hint; } else { hintEl.style.display = 'none'; }
  const fb = document.getElementById('feedback');
  fb.style.display = 'none'; fb.className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';
  const optsCol = document.getElementById('optsCol');
  const subjArea = document.getElementById('subjArea');
  optsCol.innerHTML = '';
  document.getElementById('subjAnswerBox').style.display = 'none';
  document.getElementById('subjSelfgrade').style.display = 'none';
  document.getElementById('subjInput').value = '';
  document.querySelectorAll('.sg-correct,.sg-wrong').forEach(b=>b.classList.remove('picked'));
  if (q.type === 'obj') {
    optsCol.style.display = 'flex'; subjArea.style.display = 'none';
    shuffleNoFirstAnswer(q.options, q.answer).forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn'; btn.textContent = opt;
      btn.onclick = () => selectAnswer(opt, btn);
      optsCol.appendChild(btn);
    });
  } else {
    optsCol.style.display = 'none'; subjArea.style.display = 'block';
    document.getElementById('subjCheckBtn').style.display = 'block';
  }
}
function selectAnswer(selected, clickedBtn) {
  const q = questions[current];
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
  });
  const fb = document.getElementById('feedback');
  const isCorrect = selected.toLowerCase() === q.answer.toLowerCase();
  objTotal++;
  if (isCorrect) { objScore++; clickedBtn.classList.add('correct'); fb.className = 'feedback correct'; document.getElementById('fbTitle').textContent = '✅ 정답!'; }
  else { clickedBtn.classList.add('wrong'); fb.className = 'feedback wrong'; document.getElementById('fbTitle').textContent = '❌ 오답'; wrongIndexes.push(current); }
  document.getElementById('fbBody').innerHTML = q.feedback;
  fb.style.display = 'block';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = current + 1 < questions.length ? '다음 문제 →' : '결과 보기 🏁';
}
function revealSubjAnswer() {
  const q = questions[current];
  document.getElementById('subjAnswerText').innerHTML = '<b>' + q.answer + '</b>';
  document.getElementById('subjRubric').innerHTML = q.rubric || '';
  document.getElementById('subjAnswerBox').style.display = 'block';
  document.getElementById('subjSelfgrade').style.display = 'flex';
  document.getElementById('subjCheckBtn').style.display = 'none';
}
function gradeSelf(isCorrect) {
  const q = questions[current];
  subjTotal++; subjDone++;
  document.querySelectorAll('.sg-correct,.sg-wrong').forEach(b=>b.classList.remove('picked'));
  if (isCorrect) { subjCorrectSelf++; document.querySelector('.sg-correct').classList.add('picked'); }
  else { wrongIndexes.push(current); document.querySelector('.sg-wrong').classList.add('picked'); }
  const fb = document.getElementById('feedback');
  fb.className = isCorrect ? 'feedback correct' : 'feedback wrong';
  document.getElementById('fbTitle').textContent = isCorrect ? '✅ 잘했어요!' : '📖 다시 확인해봐요';
  document.getElementById('fbBody').innerHTML = q.feedback;
  fb.style.display = 'block';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = current + 1 < questions.length ? '다음 문제 →' : '결과 보기 🏁';
}
function nextQuestion() { current++; if (current < questions.length) showQuestion(); else showResult(); }
function showResult() {
  document.getElementById('quizCard').style.display = 'none';
  const rs = document.getElementById('resultScreen'); rs.style.display = 'block';
  const pct = objTotal > 0 ? objScore / objTotal : 1;
  document.getElementById('resultStars').textContent = pct >= 0.9 ? '⭐⭐⭐' : pct >= 0.6 ? '⭐⭐' : '⭐';
  document.getElementById('resultScore').textContent = `객관식 ${objScore} / ${objTotal} 정답`;
  document.getElementById('resultScore2').textContent = `주관식 자가채점 ${subjCorrectSelf} / ${subjTotal} (완료 ${subjDone}개)`;
  document.getElementById('resultSub').textContent = pct >= 0.9 ? '완벽해요! 심화 마스터! 🎉' : pct >= 0.6 ? '잘했어요! 조금만 더 연습해봐요.' : '다시 한번 도전해봐요!';
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('retryWrongBtn').style.display = wrongIndexes.length > 0 ? 'block' : 'none';
}
function retryAll() { startQuiz(shuffle([...ALL_QUESTIONS])); }
function retryWrong() { if (!wrongIndexes.length) return; startQuiz(shuffle(wrongIndexes.map(i => questions[i]))); }
startQuiz(shuffle([...ALL_QUESTIONS]));
</script>
</body>
</html>
