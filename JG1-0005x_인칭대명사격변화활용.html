<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JG1-0005x | 인칭대명사 격변화 활용</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF6F1; --main: #1E5A46; --dark: #16432F;
    --track: #5BAD6F;
    --correct: #4CAF93; --correct-bg: #E7F7F0; --correct-text: #2E8064;
    --wrong: #E8604C; --wrong-bg: #FDEAE6; --wrong-text: #B84534;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'Nunito', 'Noto Sans KR', sans-serif; display: flex; justify-content: center; padding: 20px 0 60px; }
  .app { width: 100%; max-width: 480px; padding: 16px; padding-bottom: 40px; }
  h1 { font-size: 19px; font-weight: 800; color: var(--main); text-align: center; margin-bottom: 6px; }
  .badges { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .badge { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; font-weight: 800; color: #fff; }
  .badge-track { background: var(--track); }
  .badge-type { background: #4A90D9; }
  .progress-wrap { height: 12px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 2px #B2DFCC; margin: 14px 0 18px; }
  .progress-bar { height: 100%; border-radius: 999px; background: var(--track); transition: width 0.4s; }
  .card { background: #fff; border-radius: 20px; padding: 22px 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.10); }
  .qnum { font-size: 13px; color: #999; margin-bottom: 6px; font-weight: 700; }
  .card-instruction { font-size: 16.5px; color: var(--main); font-weight: 700; margin-bottom: 14px; line-height: 1.5; }
  .sentence-box { font-size: 23px; font-weight: 800; color: #1a1a1a; background: #F5FAF7; border-radius: 14px; padding: 16px; text-align: center; margin-bottom: 10px; line-height: 1.5; }
  .hint { font-size: 16px; color: #888; text-align: center; margin-bottom: 18px; font-style: italic; }
  .opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt-btn { font-size: 18px; font-weight: 700; padding: 14px 8px; border: 2.5px solid #B2DFCC; border-radius: 14px; background: #fff; cursor: pointer; text-align: center; color: #222; transition: all 0.15s; }
  .opt-btn:active { transform: scale(0.97); }
  .opt-btn.correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct-text); }
  .opt-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong-text); }
  .opt-btn:disabled { cursor: default; }
  .feedback { display: none; border-radius: 14px; padding: 14px; margin-top: 14px; font-size: 15.5px; line-height: 1.6; }
  .feedback.show { display: block; }
  .feedback.correct { background: var(--correct-bg); color: var(--correct-text); }
  .feedback.wrong { background: var(--wrong-bg); color: var(--wrong-text); }
  .fb-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .next-btn { display: none; width: 100%; margin-top: 14px; padding: 14px; border-radius: 14px; background: var(--main); color: #fff; font-size: 16px; font-weight: 800; border: none; cursor: pointer; }
  .next-btn.show { display: block; }
  .result { display: none; text-align: center; }
  .result.show { display: block; }
  .stars { font-size: 44px; margin: 10px 0; }
  .score { font-size: 18px; font-weight: 800; margin: 6px 0; color: var(--main); }
  .score-sub { font-size: 13.5px; color: #888; margin-bottom: 20px; }
  .result-btns { display: flex; flex-direction: column; gap: 10px; }
  .result-btn { padding: 14px; border-radius: 14px; font-size: 15.5px; font-weight: 800; border: none; cursor: pointer; }
  .btn-retry-wrong { background: var(--wrong); color: #fff; }
  .btn-retry-all { background: var(--main); color: #fff; }
</style>
</head>
<body>
<div class="app">
  <h1>인칭대명사 격변화 활용</h1>
  <div class="badges">
    <span class="badge badge-track">활용</span>
    <span class="badge badge-type">A형</span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div id="quizArea">
    <div class="card">
      <div class="qnum" id="qnum"></div>
      <div class="card-instruction" id="instruction"></div>
      <div class="sentence-box" id="sentence"></div>
      <div class="hint" id="hint"></div>
      <div class="opts-grid" id="optsGrid"></div>
      <div class="feedback" id="feedback"><div class="fb-title" id="fbTitle"></div><div id="fbBody"></div></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()"></button>
    </div>
  </div>
  <div class="result" id="resultArea">
    <div class="stars" id="stars"></div>
    <div class="score" id="scoreText"></div>
    <div class="score-sub" id="scoreSub"></div>
    <div class="result-btns">
      <button class="result-btn btn-retry-wrong" onclick="retryWrong()">오답만 다시 풀기</button>
      <button class="result-btn btn-retry-all" onclick="retryAll()">전체 다시 풀기</button>
    </div>
  </div>
</div>
<script>
const ALL_QUESTIONS = [
  {
    instruction: "빈칸에 알맞은 대명사를 고르세요.",
    sentence: "The bag is ___. (Laura가 가진 가방)",
    hint: "그 가방은 Laura의 것이다.",
    options: ["Laura", "Laura's", "her", "hers"],
    answer: "Laura's",
    feedback: "'Laura의 것'은 소유대명사 Laura's입니다. her는 목적격이나 소유격이고, hers는 명사 없이 쓰는 소유대명사입니다."
  },
  {
    instruction: "빈칸에 알맞은 대명사를 고르세요.",
    sentence: "Those bags are ___. (우리 것)",
    hint: "저 가방들은 우리 것이다.",
    options: ["us", "our", "ours", "we"],
    answer: "ours",
    feedback: "'우리의 것'처럼 명사 없이 쓸 때는 소유대명사 ours를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 대명사를 고르세요.",
    sentence: "I want to borrow ___ pencil.",
    hint: "나는 그의 연필을 빌리고 싶다.",
    options: ["he", "him", "his", "himself"],
    answer: "his",
    feedback: "명사(pencil) 앞에서 수식하는 역할이므로 소유격 his를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 대명사를 고르세요.",
    sentence: "This is ___ umbrella. (나의 것)",
    hint: "이것은 나의 우산이다.",
    options: ["I", "me", "my", "mine"],
    answer: "my",
    feedback: "명사(umbrella) 앞에서 수식하므로 소유격 my를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 대명사를 고르세요.",
    sentence: "Can you help ___?",
    hint: "너는 그들을 도와줄 수 있니?",
    options: ["they", "their", "theirs", "them"],
    answer: "them",
    feedback: "동사 help의 목적어 자리이므로 목적격 them을 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 대명사를 고르세요.",
    sentence: "___ and I went to the park together.",
    hint: "그녀와 나는 함께 공원에 갔다.",
    options: ["Her", "She", "Hers", "Herself"],
    answer: "She",
    feedback: "문장의 주어 자리이므로 주격 She를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 대명사를 고르세요.",
    sentence: "That car is ___. (그들의 것)",
    hint: "저 차는 그들의 것이다.",
    options: ["they", "their", "theirs", "them"],
    answer: "theirs",
    feedback: "명사 없이 '그들의 것'을 나타낼 때는 소유대명사 theirs를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 대명사를 고르세요.",
    sentence: "The teacher likes ___.",
    hint: "선생님은 그녀를 좋아하신다.",
    options: ["she", "her", "hers", "herself"],
    answer: "her",
    feedback: "동사 likes의 목적어 자리이므로 목적격 her를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 대명사를 고르세요.",
    sentence: "Is this jacket ___?",
    hint: "이 재킷이 너의 것이니?",
    options: ["you", "your", "yours", "yourself"],
    answer: "yours",
    feedback: "명사 없이 '너의 것'을 나타낼 때는 소유대명사 yours를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 대명사를 고르세요.",
    sentence: "___ homework is very difficult.",
    hint: "우리의 숙제는 매우 어렵다.",
    options: ["We", "Us", "Our", "Ours"],
    answer: "Our",
    feedback: "명사(homework) 앞에서 수식하므로 소유격 Our를 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 대명사를 고르세요.",
    sentence: "My parents want to meet ___.",
    hint: "우리 부모님이 그를 만나고 싶어 하신다.",
    options: ["he", "his", "him", "himself"],
    answer: "him",
    feedback: "동사 meet의 목적어 자리이므로 목적격 him을 씁니다."
  },
  {
    instruction: "빈칸에 알맞은 대명사를 고르세요.",
    sentence: "A: Whose phone is this? B: It\'s ___.",
    hint: "A: 이것은 누구의 전화기예요? B: 그것은 내 것이에요.",
    options: ["I", "me", "my", "mine"],
    answer: "mine",
    feedback: "명사 없이 '나의 것'을 나타낼 때는 소유대명사 mine을 씁니다."
  }
];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffleNoFirstAnswer(arr, answer) {
  let result; let tries = 0;
  do { result = shuffle(arr); tries++; }
  while (result[0].toLowerCase() === answer.toLowerCase() && tries < 20);
  return result;
}

let questions = [], current = 0, score = 0, wrongIndexes = [], isWrongRetry = false;

function startQuiz(qs) {
  questions = qs; current = 0; score = 0; wrongIndexes = [];
  document.getElementById('quizArea').style.display = '';
  document.getElementById('resultArea').classList.remove('show');
  showQ();
}
function showQ() {
  const q = questions[current];
  const total = questions.length;
  document.getElementById('qnum').textContent = `Q${current + 1} / ${total}`;
  document.getElementById('progressBar').style.width = `${((current) / total) * 100}%`;
  document.getElementById('instruction').textContent = q.instruction;
  document.getElementById('sentence').innerHTML = q.sentence.replace('___', '<span style="display:inline-block;min-width:64px;border-bottom:3px solid var(--main);vertical-align:bottom;margin:0 2px;"> </span>');
  document.getElementById('hint').textContent = '힌트: ' + q.hint;
  const feedback = document.getElementById('feedback');
  feedback.className = 'feedback';
  document.getElementById('nextBtn').className = 'next-btn';
  const grid = document.getElementById('optsGrid');
  grid.innerHTML = '';
  const opts = shuffleNoFirstAnswer(q.options, q.answer);
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(opt, q);
    grid.appendChild(btn);
  });
}
function selectAnswer(selected, q) {
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => {
    b.disabled = true;
    if (b.textContent.toLowerCase() === q.answer.toLowerCase()) b.classList.add('correct');
    else if (b.textContent === selected && selected.toLowerCase() !== q.answer.toLowerCase()) b.classList.add('wrong');
  });
  const isCorrect = selected.toLowerCase() === q.answer.toLowerCase();
  if (isCorrect) score++;
  else wrongIndexes.push(current);
  const feedback = document.getElementById('feedback');
  const fbTitle = document.getElementById('fbTitle');
  const fbBody = document.getElementById('fbBody');
  if (isCorrect) {
    feedback.className = 'feedback correct show';
    fbTitle.textContent = '✅ 정답!';
  } else {
    feedback.className = 'feedback wrong show';
    fbTitle.textContent = `❌ 오답 | 정답: ${q.answer}`;
  }
  fbBody.textContent = q.feedback;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.className = 'next-btn show';
  nextBtn.textContent = current + 1 < questions.length ? '다음 문제 →' : '결과 보기 🏁';
}
function nextQ() {
  current++;
  if (current < questions.length) showQ();
  else showResult();
}
function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  const result = document.getElementById('resultArea');
  result.classList.add('show');
  document.getElementById('progressBar').style.width = '100%';
  const pct = score / questions.length;
  let stars = '⭐';
  if (pct >= 0.9) stars = '⭐⭐⭐';
  else if (pct >= 0.6) stars = '⭐⭐';
  document.getElementById('stars').textContent = stars;
  document.getElementById('scoreText').textContent = `${score} / ${questions.length} 정답`;
  document.getElementById('scoreSub').textContent = `정답률 ${Math.round(pct * 100)}%`;
}
function retryWrong() {
  if (wrongIndexes.length === 0) { retryAll(); return; }
  const wrongQs = wrongIndexes.map(i => questions[i]);
  wrongIndexes = [];
  isWrongRetry = true;
  startQuiz(shuffle(wrongQs));
}
function retryAll() {
  isWrongRetry = false;
  startQuiz(shuffle([...ALL_QUESTIONS]));
}
startQuiz(shuffle([...ALL_QUESTIONS]));
</script>
</body>
</html>
